/* ================= selection ================= */
function selectArea(kind) {
  const last = ui.lastByArea[kind];
  const target = last && db.teams[last] && !db.teams[last].deleted && kindOf(last) === kind ? last : teamsOfKind(kind)[0]?.id;
  if (target) selectTeam(target);
  else teamDialog(null, kind);
}
function selectTeam(id) {
  ui.teamId = id;
  const g = gameLive(ui.gameId);
  if (!g || !g.teamIds.includes(id)) {
    const first = gamesOf(id)[0];
    if (first) { selectGame(first.id); return; }
    ui.gameId = null;
    if (!ui.reel.active) { ui.loadedGameId = null; ui.playClip = null; if (ready()) player.pauseVideo(); }
  }
  saveUi(); renderAll();
}
function selectGame(id, { start, autoplay = false } = {}) {
  const g = gameLive(id); if (!g) return;
  ui.gameId = id;
  if (!g.teamIds.includes(ui.teamId)) ui.teamId = g.teamIds[0];
  if (ui.loadedGameId !== id) {
    if (ui.reel.active) stopReel(true);
    ui.playClip = null;
    clearShowing();
    ui.loadedGameId = id;
    lastDur = 0;
    $('#frame').classList.remove('started');
    openVideo(g.videoId, start ?? pos[id] ?? 0, autoplay);
  } else if (start != null) seekTo(start, { keepClip: true });
  saveUi(); renderAll();
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-mode]');
  if (tab) { setMode(tab.dataset.mode); setScreen('watch'); renderNav(); return; }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const { act, id, v } = b.dataset;
  const d = ui.draft;
  if (b.hasAttribute('data-close') && $('#dlg').open) $('#dlg').close();
  switch (act) {
    case 'team': selectTeam(id); break;
    case 'game': selectGame(id); if (phone() && (ui.profileId || ui.mode === 'report')) setMode('study'); setScreen('watch'); break;
    case 'screen': setScreen(v); renderNav(); break;
    case 'menu': menuDialog(); break;
    case 'install': installPrompt?.prompt(); installPrompt = null; break;
    case 'listAuthor': ui.listAuthor = v || null; renderClipList(); renderTimeline(); break;
    case 'fsTag':
      exitFull(); setScreen('watch');
      if (ui.mode !== 'study' || ui.profileId) openEditor();
      requestAnimationFrame(() => $('#editor')?.scrollIntoView({ block: 'start', behavior: 'smooth' }));
      break;
    case 'reelPlayFull': enterFull(); startReel(0); break;
    case 'addTeam': teamDialog(); break;
    case 'addLibrary': teamDialog(null, 'library'); break;
    case 'editTeam': teamDialog(db.teams[ui.teamId]); break;
    case 'addNote': noteDialog(); break;
    case 'editNote': noteDialog(db.notes[id]); break;
    case 'allNotes': ui.notesAll = ui.notesAll === ui.teamId ? null : ui.teamId; renderRail(); break;
    case 'addGame': gameDialog(); break;
    case 'editGame': gameDialog(db.games[id]); break;
    case 'addPlayer': playerDialog(); break;
    case 'editPlayer': playerDialog(db.players[id]); break;
    case 'sample': {
      let t = live('teams').find(x => x.sample);
      if (!t) { t = touch({ id: uid('team'), name: 'Sample team', color: '#9ad1d4', order: 99, notes: '', sample: true }); db.teams[t.id] = t; }
      addGame({ url: SAMPLE.videoId, title: SAMPLE.title, teamIds: [t.id] });
      toast('Sample loaded. Remove it any time with Edit next to the team name.');
      break;
    }
    case 'play': togglePlay(); break;
    case 'seek': seekBy(+v); break;
    case 'full': toggleFullscreen(); break;
    case 'cc': toggleCaptions(); break;
    case 'ytc': toggleYtControls(); break;
    case 'markIn': markIn(); break;
    case 'markOut': markOut(); break;
    case 'draw': ui.drawing ? saveDrawing() : startDrawing(); break;
    case 'tool': ui.tool = ui.drawing.tool = v; renderDrawbar(); break;
    case 'ink': ui.ink = ui.drawing.color = v; renderDrawbar(); break;
    case 'undoInk': ui.drawing.shapes.pop(); renderInk(); break;
    case 'clearInk': ui.drawing.shapes = []; renderInk(); break;
    case 'cancelInk': cancelDrawing(); break;
    case 'saveInk': saveDrawing(); break;
    case 'continueInk': continueFromInk(); break;
    case 'keepPaused': keepPaused(); break;
    case 'listFilter': ui.listFilter = v; renderPanel(); break;
    case 'playClip': { const c = db.clips[id]; if (c) { if (ui.reel.active) stopReel(true); playClip(c); } break; }
    case 'loopClip': {
      const c = db.clips[id]; if (!c) break;
      if (ui.playClip?.id === id && ui.playClip.loop) { ui.playClip.loop = false; markPlayingRow(); }
      else { if (ui.reel.active) stopReel(true); playClip(c, { loop: true }); }
      break;
    }
    case 'editClip': editClip(db.clips[id]); break;
    case 'showClipInk': {
      const c = db.clips[id], dr = c && [...(c.drawings || [])].sort((a, b) => a.t - b.t)[0];
      if (!dr) break;
      if (ui.loadedGameId !== c.gameId) selectGame(c.gameId, { start: dr.t });
      else { player.pauseVideo(); seekTo(dr.t, { keepClip: true }); }
      showInk(dr, { isStatic: true });
      break;
    }
    case 'setIn': if (d && requireGame()) { d.start = Math.round(curTime() * 10) / 10; if (d.end <= d.start) d.end = d.start + 10; syncEditorTimes(); renderDraftRange(); } break;
    case 'setOut': if (d && requireGame()) { d.end = Math.round(curTime() * 10) / 10; if (d.end <= d.start) d.start = Math.max(0, d.end - 10); syncEditorTimes(); renderDraftRange(); } break;
    case 'previewDraft': if (d) { readDraftTimes(); const g = gameLive(d.gameId); if (g) { ui.playClip = { id: d.id || '__draft', start: d.start, end: d.end, loop: false, seen: false }; ui.lastTriggered = null; lastT = d.start; openVideo(g.videoId, d.start, true); } } break;
    case 'edTeam': d.teamId = v; d.playerIds = []; renderEditor(); break;
    case 'edSide': d.side = v; ui.lastSide = v; d.note = $('#edNote')?.value ?? d.note; readDraftTimes(); renderEditor(); break;
    case 'edPri': d.priority = +v; $$('[data-act="edPri"]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); break;
    case 'edVerdict': d.verdict = v; $$('[data-act="edVerdict"]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); break;
    case 'area': selectArea(v); break;
    case 'addUs': teamDialog(null, 'us'); break;
    case 'teamRoom': inRoom() && !DEV_SYNC ? teamPanelDialog() : sync.on ? copyText(inviteLink(), 'Invite link') : teamRoomDialog(); break;
    case 'copyInvite': copyText(inviteLink(), 'Invite link'); break;
    case 'approve': setMemberStatus(id, 'approved'); break;
    case 'removeMember': if (armDanger(b, 'Tap again to confirm')) setMemberStatus(id, 'removed'); break;
    case 'signOut': if (armDanger(b, 'Tap again to sign out')) signOutHere(); break;
    case 'news': newsDialog(); break;
    case 'newsPlay': { $('#dlg').close(); const c = db.clips[id]; if (c) { if (ui.reel.active) stopReel(); playClip(c); } break; }
    case 'playPlayerReel':
      ui.reel.f = { teamId: db.players[id]?.teamId || ui.teamId, side: 'all', tags: [], players: [id], minPri: 1, verdict: 'all' };
      if (!ui.profileId) setMode('reel', false);
      startReel(0); renderPanel();
      break;
    case 'openProfile': openProfile(id); break;
    case 'closeProfile': ui.profileId = null; renderPanel(); renderRail(); if (ui.profileFrom === 'teams') setScreen('teams'); break;
    case 'tendency': {
      const p = db.players[ui.profileId]; if (!p) break;
      const list = p.tendencies = p.tendencies || [], i = list.indexOf(v);
      if (i >= 0) list.splice(i, 1); else list.push(v);
      touch(p); save();
      b.classList.toggle('on', i < 0); b.setAttribute('aria-pressed', String(i < 0));
      break;
    }
    case 'pfSide': ui.pf.side = v; renderPanel(); break;
    case 'pfTag': ui.pf.tag = ui.pf.tag === v ? null : v; renderPanel(); break;
    case 'follow': {
      const p = db.players[id];
      ui.followId = ui.followId === id ? null : id;
      renderPanel(); renderStageHead();
      toast(ui.followId ? `Following ${p.name}. New clips are tagged with them.` : `Stopped following ${p.name}.`);
      break;
    }
    case 'copyProfile': copyText(profileText(db.players[id]), 'Profile'); break;
    case 'edTag': { const i = d.tags.indexOf(v); if (i >= 0) d.tags.splice(i, 1); else d.tags.push(v); b.classList.toggle('on', i < 0); b.setAttribute('aria-pressed', String(i < 0)); break; }
    case 'edPlayer': { const i = d.playerIds.indexOf(v); if (i >= 0) d.playerIds.splice(i, 1); else d.playerIds.push(v); b.classList.toggle('on', i < 0); b.setAttribute('aria-pressed', String(i < 0)); break; }
    case 'viewInk': { const x = d?.drawings.find(z => z.id === v); if (x && ready()) { player.pauseVideo(); seekTo(x.t, { keepClip: true }); showInk(x, { isStatic: true }); } break; }
    case 'editInk': { const x = d?.drawings.find(z => z.id === v); if (x) startDrawing(x); break; }
    case 'removeInk': if (d) { d.drawings = d.drawings.filter(z => z.id !== v); clearShowing(); $('#edDrawings').innerHTML = drawingRows(d); toast('Drawing removed. Save the clip to keep this change.'); } break;
    case 'saveDraft': saveDraft(); break;
    case 'cancelDraft': cancelDraft(); break;
    case 'deleteClip': if (armDanger(b, 'Click again to delete')) deleteClip(d.id); break;
    case 'rf': { const f = ui.reel.f; f[b.dataset.k] = b.dataset.k === 'minPri' ? +v : v; renderReel(); break; }
    case 'rfTag': { const f = ui.reel.f, i = f.tags.indexOf(v); i >= 0 ? f.tags.splice(i, 1) : f.tags.push(v); renderReel(); break; }
    case 'rfPlayer': { const f = ui.reel.f, i = f.players.indexOf(v); i >= 0 ? f.players.splice(i, 1) : f.players.push(v); renderReel(); break; }
    case 'reelPlay': startReel(0); break;
    case 'reelJump': startReel(+v); break;
    case 'reelNext': reelNext(); break;
    case 'reelPrev': reelPrev(); break;
    case 'reelStop': stopReel(); if (ready()) player.pauseVideo(); break;
    case 'copyReel': copyText(reelText(), 'Reel timestamps'); break;
    case 'copyReport': copyText(reportText(db.teams[ui.teamId]), 'Report'); break;
    case 'playMust': ui.reel.f = { teamId: ui.teamId, side: 'all', tags: [], players: [], minPri: 3 }; setMode('reel', false); startReel(0); renderPanel(); break;
    case 'export': exportPack(); break;
    case 'import': $('#importFile').click(); break;
    case 'help': helpDialog(); break;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'edNote' && ui.draft) ui.draft.note = t.value;
  else if (t.id === 'teamNotes') { const tm = db.teams[ui.teamId]; if (tm) { tm.notes = t.value; touch(tm); save(); } }
  else if (t.id === 'myName' || t.id === 'menuName') {
    me = t.value.trim(); store.set(KEY_ME, me);
    if (t.id === 'menuName') $('#myName').value = me;
    $('#myName').classList.toggle('needs', !me); $('#menuDot').hidden = !!me;
  }
  else if (t.id === 'division' || t.id === 'menuDivision') { db.division = t.value; db.divisionAt = Date.now(); save(); if (t.id === 'menuDivision') $('#division').value = t.value; }
  else if (t.id === 'dbLabel') ui.labels[ui.drawing?.tool === 'd' ? 'd' : 'o'] = t.value;
  else if (t.dataset.pf && ui.profileId) { const p = db.players[ui.profileId]; p[t.dataset.pf] = t.value; touch(p); save(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if ((t.id === 'edIn' || t.id === 'edOut') && ui.draft) {
    const val = parseTime(t.value);
    if (val == null) { toast('Type a time like 12:34 or 1:02:03.'); syncEditorTimes(); return; }
    ui.draft[t.id === 'edIn' ? 'start' : 'end'] = val;
    syncEditorTimes(); renderDraftRange();
  } else if (t.dataset.change === 'hold' && ui.draft) {
    const x = ui.draft.drawings.find(z => z.id === t.dataset.v); if (x) x.hold = +t.value;
  } else if (t.id === 'speed' || t.id === 'fsSpeed') { ui.speed = +t.value; applySpeed(); t.blur(); }
  else if (t.id === 'stopAtDrawings' || t.id === 'rfStop') { ui.stopAtDrawings = t.checked; $('#stopAtDrawings').checked = t.checked; saveUi(); }
  else if (t.id === 'rfTeam') { Object.assign(ui.reel.f, { teamId: t.value, players: [], verdict: 'all' }); renderReel(); }
  else if (t.id === 'importFile') { const f = t.files[0]; t.value = ''; if (f) importFile(f); }
});
document.addEventListener('submit', e => {
  if (e.target.dataset.form !== 'quickGame') return;
  e.preventDefault();
  const msg = addGame({ url: $('#qgUrl').value, title: '', teamIds: [ui.teamId], assignee: me });
  if (msg) toast(msg);
});

function addCustomTag(input) {
  const v = input.value.trim().replace(/\s+/g, ' ');
  if (!v || !ui.draft) return;
  const all = [...TAG_GROUPS.flatMap(g => g.tags), ...(db.customTags || [])];
  const existing = all.find(x => norm(x) === norm(v)) || v;
  if (!all.includes(existing)) { db.customTags = [...(db.customTags || []), existing]; save(); }
  if (!ui.draft.tags.includes(existing)) ui.draft.tags.push(existing);
  $('#edTags').innerHTML = tagChips(ui.draft);
  $('#edNewTag')?.focus();
}
function addQuickPlayer(input) {
  const raw = input.value.trim();
  if (!raw || !ui.draft) return;
  const m = raw.match(/^#?(\d{1,3})\s*(.*)$/);
  const number = m ? m[1] : '', name = (m ? m[2] : raw).trim() || `#${number}`;
  let p = rosterOf(ui.draft.teamId).find(x => (number && String(x.number) === number) || norm(x.name) === norm(name));
  if (!p) { p = touch({ id: uid('pl'), teamId: ui.draft.teamId, number, name, role: '', threat: 0, notes: '' }); db.players[p.id] = p; save(); renderRail(); }
  if (!ui.draft.playerIds.includes(p.id)) ui.draft.playerIds.push(p.id);
  $('#edPlayers').innerHTML = playerChips(ui.draft);
  $('#edNewPlayer')?.focus();
}

document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.id === 'edNewTag' && e.key === 'Enter') { e.preventDefault(); addCustomTag(t); return; }
  if (t.id === 'edNewPlayer' && e.key === 'Enter') { e.preventDefault(); addQuickPlayer(t); return; }
  if (t.id === 'pfNewTendency' && e.key === 'Enter') {
    e.preventDefault();
    const p = db.players[ui.profileId], v = t.value.trim().replace(/\s+/g, ' ');
    if (p && v && !(p.tendencies || []).some(x => norm(x) === norm(v))) { p.tendencies = [...(p.tendencies || []), v]; touch(p); save(); renderPanel(); $('#pfNewTendency')?.focus(); }
    return;
  }
  if (t.id === 'edNote' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveDraft(); return; }
  if ($('#dlg').open) return;
  if (t.closest('input, textarea, select, [contenteditable="true"]')) { if (e.key === 'Escape') t.blur(); return; }
  if (e.altKey) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;

  if (ui.drawing) {
    if (k === 'Escape') cancelDrawing();
    else if (k === 'Enter') saveDrawing();
    else if (k === 'z' && (e.ctrlKey || e.metaKey)) { ui.drawing.shapes.pop(); renderInk(); }
    else return;
    e.preventDefault(); return;
  }
  if (e.ctrlKey || e.metaKey) return;
  if (k === 'Enter' && t.closest('button, a')) return;
  const handled = {
    ' ': togglePlay, k: togglePlay,
    j: () => seekBy(-5), l: () => seekBy(5),
    ArrowLeft: () => seekBy(-10), ArrowRight: () => seekBy(10), c: toggleCaptions,
    ',': () => step(-0.1), '.': () => step(0.1),
    '[': () => changeSpeed(-1), ']': () => changeSpeed(1),
    i: markIn, o: markOut, d: () => startDrawing(), f: toggleFullscreen,
    n: () => ui.reel.active && reelNext(), p: () => ui.reel.active && reelPrev(),
    Enter: () => ui.draft && saveDraft(),
    Escape: () => { if (ui.showing && !ui.showing.static) keepPaused(); else if (isFull()) exitFull(); else if (ui.draft) cancelDraft(); },
  }[k];
  if (handled) { e.preventDefault(); handled(); }
});

/* timeline interaction: tap to jump, tap a block to play that clip, drag to scrub */
const track = $('#track');
let scrub = null, scrubbedAt = 0;
const trackFrac = x => { const r = track.getBoundingClientRect(); return clamp((x - r.left) / r.width, 0, 1); };
function showTrackTime(f) {
  const dur = lastDur || duration(), ht = $('#hoverTime');
  if (!dur) { ht.hidden = true; return; }
  ht.hidden = false; ht.textContent = fmt(f * dur); ht.style.left = `${f * 100}%`;
}
track.addEventListener('click', e => {
  const dur = lastDur || duration();
  if (!dur || performance.now() - scrubbedAt < 300) return;
  const seg = e.target.closest('[data-clip]');
  if (seg) { const c = db.clips[seg.dataset.clip]; if (c) { if (ui.reel.active) stopReel(true); playClip(c); } return; }
  seekTo(trackFrac(e.clientX) * dur);
});
track.addEventListener('pointerdown', e => {
  if (!(lastDur || duration()) || e.button > 0) return;
  scrub = { id: e.pointerId, x0: e.clientX, moved: false, f: 0, kind: e.pointerType };
});
track.addEventListener('pointermove', e => {
  const f = trackFrac(e.clientX);
  if (scrub && scrub.id === e.pointerId) {
    if (!scrub.moved && Math.abs(e.clientX - scrub.x0) > 8) { scrub.moved = true; try { track.setPointerCapture(e.pointerId); } catch {} }
    if (scrub.moved) { scrub.f = f; $('#playhead').style.left = `${f * 100}%`; showTrackTime(f); return; }
  }
  if (e.pointerType === 'mouse') showTrackTime(f);
});
const endScrub = e => {
  if (!scrub || scrub.id !== e.pointerId) return;
  const s = scrub; scrub = null;
  if (s.moved) {
    scrubbedAt = performance.now();
    seekTo(s.f * (lastDur || duration()));
    if (s.kind !== 'mouse') $('#hoverTime').hidden = true;
  }
};
track.addEventListener('pointerup', endScrub);
track.addEventListener('pointercancel', e => { if (scrub?.id === e.pointerId) { scrub = null; $('#hoverTime').hidden = true; } });
track.addEventListener('mouseleave', () => { if (!scrub) $('#hoverTime').hidden = true; });

// Keeps the notes below the pinned video from hiding under it when the page scrolls to them.
new ResizeObserver(() => document.documentElement.style.setProperty('--video-h', `${$('#videoWrap').offsetHeight}px`)).observe($('#videoWrap'));
new ResizeObserver(() => document.documentElement.style.setProperty('--fsb', `${$('#fsBottom').offsetHeight}px`)).observe($('#fsBottom'));

/* ================= boot ================= */
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
fixSelection();
renderNav();
renderAll();
renderTeamButton();
renderStatus();
if (ui.gameId) selectGame(ui.gameId);
if (DEV_SYNC) {
  const room = roomFromText(location.hash) || store.get(KEY_ROOM);
  if (room && me) { adoptRoom(room); startSync(room); }
  else teamRoomDialog(room);
} else if (SYNC_AVAILABLE) {
  // Wait to learn whether this device is already signed in, then go straight back into the room.
  firebase().then(f => {
    let first = true;
    f.A.onAuthStateChanged(f.auth, user => {
      team.user = user;
      renderTeamButton();
      if (!first) return;
      first = false;
      const room = roomFromText(location.hash) || store.get(KEY_ROOM);
      if (user && room) {
        if (!me && user.displayName) setMe(user.displayName.split(' ')[0]);
        enterRoom(room).catch(e => {
          console.error(e);
          if (e.code === 'no-room') teamRoomDialog(room, { claim: true });
          else { toast(teamError(e)); teamRoomDialog(room); }
        });
      } else teamRoomDialog(room);
    });
  }).catch(e => { console.error(e); sync.failed = true; renderStatus(); toast('Could not reach the team database. Your notes still save on this device.'); });
}
})();
</script>
