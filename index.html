<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Film Room</title>
<meta name="theme-color" content="#0d1215">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Film Room">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: a film desk in three columns: opponents rail | video stage with a lane timeline | notes panel */
:root {
  color-scheme: dark;
  --bg: #0d1215;
  --surface: #131a1e;
  --raised: #1a2328;
  --sunk: #090d0f;
  --line: #243037;
  --line-strong: #34434c;
  --text: #e6edef;
  --muted: #8d9ea6;
  --faint: #5f6f77;
  --video: #000;
  --o: #ffd23f;              /* their offence: telestrator yellow */
  --o-soft: rgba(255, 210, 63, .13);
  --on-o: #1d1700;
  --d: #4cc9f0;              /* their defence */
  --d-soft: rgba(76, 201, 240, .13);
  --on-d: #00161f;
  --p: #f4845f;              /* player focus */
  --p-soft: rgba(244, 132, 95, .14);
  --on-p: #230b02;
  --danger: #ff6b6b;
  --danger-soft: rgba(255, 107, 107, .14);
  --good: #7bd389;
  --good-soft: rgba(123, 211, 137, .14);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 6px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
input, select, textarea { background: var(--sunk); border: 1px solid var(--line-strong); border-radius: var(--r); padding: 6px 9px; min-width: 0; }
input:focus, select:focus, textarea:focus { border-color: var(--muted); outline: none; }
textarea { width: 100%; resize: vertical; line-height: 1.45; }
:focus-visible { outline: 2px solid var(--o); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
a { color: inherit; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: .86em; }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: 14px; }
.spacer { flex: 1; }
.eyebrow { display: block; font: 600 12px/1.2 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.count { font: 500 12px var(--font-mono); color: var(--faint); margin-left: 4px; }
kbd { font: 500 11px/1.5 var(--font-mono); border: 1px solid currentColor; border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; opacity: .65; margin-left: 4px; }
@media (hover: none) { kbd { display: none; } }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--raised); border-radius: var(--r); padding: 6px 12px; font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--o); color: var(--on-o); border-color: var(--o); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.small { padding: 3px 9px; font-size: 13px; }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--sunk); border-color: var(--danger); }
.mini { border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; padding: 2px 6px; border-radius: 4px; text-decoration: none; }
.mini:hover { color: var(--text); background: var(--raised); }
.mini[aria-pressed="true"] { color: var(--o); }
.mini.danger:hover { color: var(--danger); }
.linkish { border: 0; background: none; padding: 0; color: var(--text); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--faint); }
.linkish:hover { text-decoration-color: var(--text); }

.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; background: var(--sunk); border: 1px solid var(--line); border-radius: 7px; padding: 2px; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 5px 10px; border-radius: 5px; font-weight: 600; font-size: 13px; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
.seg button.o[aria-pressed="true"] { background: var(--o-soft); color: var(--o); box-shadow: inset 0 0 0 1px var(--o); }
.seg button.d[aria-pressed="true"] { background: var(--d-soft); color: var(--d); box-shadow: inset 0 0 0 1px var(--d); }
.seg button.p[aria-pressed="true"] { background: var(--p-soft); color: var(--p); box-shadow: inset 0 0 0 1px var(--p); }

.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid var(--line-strong); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 500; }
.chip:hover { border-color: var(--muted); }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.o .chip.on { background: var(--o); color: var(--on-o); border-color: var(--o); }
.d .chip.on { background: var(--d); color: var(--on-d); border-color: var(--d); }
.p .chip.on { background: var(--p); color: var(--on-p); border-color: var(--p); }
.chip-input { border-radius: 999px; padding: 3px 10px; font-size: 13px; width: 9.5em; border-style: dashed; background: transparent; }

.pill { display: inline-block; font: 700 11px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; padding: 4px 6px 3px; border-radius: 4px; white-space: nowrap; }
.pill.o { background: var(--o-soft); color: var(--o); }
.pill.d { background: var(--d-soft); color: var(--d); }
.pill.p { background: var(--p-soft); color: var(--p); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.fix { background: var(--danger-soft); color: var(--danger); }
.seg button.good[aria-pressed="true"] { background: var(--good-soft); color: var(--good); box-shadow: inset 0 0 0 1px var(--good); }
.seg button.fix[aria-pressed="true"] { background: var(--danger-soft); color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); }
.badge { display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--o); color: var(--on-o); font: 700 11px/1 var(--font-mono); }

/* ---------- frame of the app ---------- */
.app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
.topbar { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { width: 28px; height: 28px; flex: none; }
.brand-name { font: 700 23px/1 var(--font-display); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
.division { background: transparent; border-color: transparent; color: var(--muted); font: 600 15px var(--font-display); letter-spacing: .08em; text-transform: uppercase; width: 14em; }
.division:hover, .division:focus { border-color: var(--line-strong); color: var(--text); }
.modes { display: flex; gap: 2px; background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 3px; margin-inline: auto; }
.modes button { border: 0; background: transparent; padding: 7px 14px 6px; border-radius: 6px; font: 600 15px/1 var(--font-display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.modes button:hover { color: var(--text); }
.modes button[aria-selected="true"] { background: var(--raised); color: var(--text); box-shadow: inset 0 -2px 0 var(--o); }
.me { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.me-name { display: flex; align-items: center; gap: 6px; }
.me-name input { width: 8.5em; padding: 5px 8px; }
.me-name input.needs { border-color: var(--o); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--faint); white-space: nowrap; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.status.live { color: var(--muted); }
.status.live .sync-dot { background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
.status.saving .sync-dot { background: var(--o); }
.status.error { color: var(--danger); }
.status.error .sync-dot { background: var(--danger); }

.desk { display: grid; grid-template-columns: 250px minmax(0, 1fr) 390px; min-height: 0; }
.rail { border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 12px 28px; padding-left: max(12px, env(safe-area-inset-left, 0px)); background: var(--surface); }
.stage { overflow-y: auto; padding: 16px 20px 28px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.panel { border-left: 1px solid var(--line); overflow-y: auto; padding: 16px 18px 40px; padding-right: max(18px, env(safe-area-inset-right, 0px)); background: var(--surface); min-width: 0; }

/* ---------- rail ---------- */
.areas { display: flex; width: 100%; margin-bottom: 12px; }
.areas button { flex: 1; padding: 6px 2px; font: 600 13px/1 var(--font-display); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.areas + .team-detail { border-top: 0; padding-top: 4px; }
.rail-label { padding: 0 8px; }
.teams { display: flex; flex-direction: column; gap: 2px; margin: 6px 0 4px; }
.team { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: var(--r); color: var(--muted); }
.team:hover { color: var(--text); background: var(--raised); }
.team .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.team .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.team .ct { font: 500 12px var(--font-mono); color: var(--faint); }
.team[aria-current="true"] { background: var(--raised); color: var(--text); box-shadow: inset 2px 0 0 var(--c); }
.add-team { margin: 0 0 14px 4px; }
.team-detail { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 18px; }
.team-head { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
.team-head h2 { font: 700 24px/1.05 var(--font-display); letter-spacing: .02em; text-transform: uppercase; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.sec { display: flex; flex-direction: column; gap: 6px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px; }
.sec .hint { padding: 0 4px; font-size: 13px; }
.games, .roster { display: flex; flex-direction: column; gap: 2px; }
.game, .player { display: flex; width: 100%; text-align: left; border: 0; background: transparent; border-radius: var(--r); padding: 7px 8px; gap: 8px; }
.game { flex-direction: column; gap: 1px; }
.game:hover, .player:hover { background: var(--raised); }
.game[aria-current="true"] { background: var(--raised); box-shadow: inset 2px 0 0 var(--o); }
.g-title { font-weight: 600; font-size: 14px; line-height: 1.3; }
.g-meta { font-size: 12px; color: var(--muted); }
.notes { display: flex; flex-direction: column; gap: 6px; }
.note { padding: 8px 10px; border-radius: var(--r); background: var(--raised); }
.note p { font-size: 14px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
.note p[data-act] { cursor: pointer; }
.note.clamped > p:first-child { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; line-clamp: 4; overflow: hidden; }
.note .note-orig { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.note-orig .eyebrow { display: block; margin-bottom: 2px; }
.voice-slot:empty { display: none; }
.voice-slot audio { width: 100%; height: 36px; margin-top: 8px; }
.sec-toggle { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 4px 0; color: inherit; cursor: pointer; }
.sec-toggle .chev { color: var(--muted); font-size: 12px; }
.note-meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--muted); }
.voice { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border: 1px dashed var(--line-strong); border-radius: var(--r); }
.voice-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.voice-row .btn { gap: 6px; cursor: pointer; }
.voice-row .btn svg { width: 16px; height: 16px; }
.voice-row .btn.busy { opacity: .55; pointer-events: none; }
.voice-row select { width: auto; }
.voice-bar { width: 100%; height: 6px; accent-color: var(--o); }
.voice .toggle { white-space: normal; }
.sec .more { align-self: flex-start; margin-left: 4px; }
.player { align-items: center; }
.player .num { width: 2.4em; color: var(--muted); text-align: right; flex: none; }
.player .pname { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; display: flex; flex-direction: column; line-height: 1.25; }
.player small { font-weight: 400; color: var(--muted); font-size: 12px; }
.player .ct { font: 500 12px var(--font-mono); color: var(--faint); }
.threat { font: 700 10px/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; padding: 3px 5px; border-radius: 3px; border: 1px solid currentColor; }
.threat.t3 { color: var(--danger); }
.threat.t2 { color: var(--o); }
.threat.t1 { color: var(--faint); }

/* ---------- stage ---------- */
.stage-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; min-height: 10px; }
.stage-head:empty { display: none; }
.sh-title { flex: 1; min-width: 0; }
.sh-title h1 { font: 700 26px/1.1 var(--font-display); letter-spacing: .01em; overflow-wrap: anywhere; }
.sh-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 4px; font-size: 13px; }
.tchip { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.tchip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.sh-actions { display: flex; gap: 6px; }

.video-wrap { background: var(--video); border-radius: 8px; overflow: hidden; border: 1px solid var(--line); display: flex; flex-direction: column; }
.frame { position: relative; aspect-ratio: 16 / 9; width: 100%; max-width: 100%; background: var(--video); overflow: hidden; }
.frame #yt { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.frame:not(.has-game) #yt { visibility: hidden; }
#ink { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; cursor: pointer; touch-action: manipulation; }
.frame:not(.started) #ink { pointer-events: none; }
.frame.drawing #ink { pointer-events: auto; cursor: crosshair; touch-action: none; }
.frame.drawing.selecting #ink { cursor: default; }
.drawbar .btn:disabled { opacity: .4; cursor: default; }
.video-wrap.ytc .frame:not(.drawing) #ink { pointer-events: none; }
.seek-flash { position: absolute; top: 50%; z-index: 3; transform: translateY(-50%); padding: 10px 16px; border-radius: 999px; background: rgba(9,13,15,.72); color: #fff; font: 700 18px var(--font-mono); pointer-events: none; opacity: 0; transition: opacity .25s; }
.seek-flash.l { left: 12%; } .seek-flash.r { right: 12%; }
.seek-flash.show { opacity: 1; transition: none; }

/* Full screen: the video wrap covers the whole screen. Works on iPhone too, where web pages cannot use real full screen. */
.fs-ui { display: none; }
body.full { overflow: hidden; }
body.full .video-wrap { position: fixed; inset: 0; z-index: 40; margin: 0; border: 0; border-radius: 0; justify-content: center; background: #000;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
body.full .frame { flex: none; margin-inline: auto; width: min(100%, calc((100vh - var(--bar-h, 0px) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 16 / 9)); }
@supports (height: 100dvh) {
  body.full .frame { width: min(100%, calc((100dvh - var(--bar-h, 0px) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 16 / 9)); }
}
body.full .caption { padding-right: 70px; }
body.full .fs-ui { display: flex; flex-direction: column; justify-content: flex-end; position: absolute; inset: 0; z-index: 8; pointer-events: none; transition: opacity .2s; }
body.full .fs-ui > * { pointer-events: auto; }
.video-wrap.drawing .fs-ui { display: none !important; }
.video-wrap.idle .fs-ui { opacity: 0; }
.video-wrap.idle .fs-ui > * { pointer-events: none; }
.video-wrap.idle { cursor: none; }
.fs-exit { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); background: rgba(9,13,15,.72); color: #fff; display: grid; place-items: center; }
.fs-exit svg { width: 18px; height: 18px; }
.fs-bottom { display: flex; flex-direction: column; gap: 10px; padding: 36px max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.85) 45%); }
/* With YouTube's controls on, taps on the video go to its player: tapping pauses it, which brings ours back.
   Only our buttons catch taps, so the rest of the strip still reaches YouTube's own controls. */
body.full .video-wrap.ytc .fs-bottom { pointer-events: none; }
body.full .video-wrap.ytc .fs-bottom > * { pointer-events: auto; }
.video-wrap.ytc.idle .fs-bottom > * { pointer-events: none; }
.fs-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 14px; }
.fs-group { display: flex; align-items: center; gap: 8px; }
.fs-btn { min-width: 46px; height: 46px; padding: 0 12px; border-radius: 23px; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.12); color: #fff; font: 600 15px var(--font-body); display: inline-grid; place-items: center; white-space: nowrap; }
.fs-btn svg { width: 18px; height: 18px; }
.fs-btn.play { width: 58px; height: 52px; border-radius: 26px; background: #fff; color: #000; border-color: #fff; }
.fs-btn.draw { color: var(--o); border-color: rgba(255,210,63,.55); }
.fs-btn.primary { background: var(--o); color: var(--on-o); border-color: var(--o); }
.fs-btn:active { filter: brightness(1.25); }
select.fs-btn { appearance: none; -webkit-appearance: none; text-align: center; text-align-last: center; font-family: var(--font-mono); }
.fs-clock { color: #fff; font-size: 15px; white-space: nowrap; text-shadow: 0 1px 2px #000; }
.fs-draft { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 8px 8px 8px 14px; border-radius: 12px; background: rgba(9,13,15,.9); border: 1px solid var(--o); color: #fff; font-size: 14px; }
.fs-draft b { color: var(--o); font: 700 14px var(--font-display); letter-spacing: .08em; text-transform: uppercase; }
body.full .timeline { margin: 0; }
body.full .lane { background: rgba(255,255,255,.16); }
@media (orientation: landscape) {
  body.full .video-wrap:not(.idle) .tele { bottom: calc(var(--fsb, 120px) + 10px); }
}
@media (orientation: portrait) {
  /* Upright phone: the video sits in the middle with the controls right under it, so nothing covers the picture. */
  body.full .fs-ui { position: static; transition: none; }
  body.full .fs-bottom { background: none; padding-top: 16px; }
}

.caption { --fade: 26px; position: absolute; top: 0; left: 0; right: 0; z-index: 2; padding: 10px 14px var(--fade); background: linear-gradient(rgba(0,0,0,.84) calc(100% - var(--fade)), rgba(0,0,0,0)); pointer-events: none; display: flex; flex-direction: column; gap: 3px; max-width: 100%; }
.cap-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.cap-idx { color: var(--text); background: rgba(255,255,255,.14); padding: 2px 6px; border-radius: 4px; }
.cap-team { font: 700 15px/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; }
.cap-tags { color: #d6dde0; }
.cap-note { font-size: 15px; line-height: 1.35; max-width: 70ch; color: #fff; white-space: pre-wrap; overflow-wrap: anywhere; }
.cap-by { font-size: 12px; color: #b8c3c7; white-space: nowrap; }
.cap-players { font-size: 12px; color: #cfd8dc; }

.tele { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 3; display: flex; align-items: center; gap: 8px; background: rgba(9,13,15,.88); border: 1px solid var(--line-strong); border-radius: 999px; padding: 5px 6px 5px 14px; font-size: 13px; white-space: nowrap; max-width: calc(100% - 24px); }
.tele b { font: 700 13px var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--o); }
.tele .btn { border-radius: 999px; }

.empty { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; padding: 20px; text-align: center; background: radial-gradient(ellipse at 50% 45%, #15232a 0%, var(--sunk) 75%); overflow: auto; }
.empty .field-lines { position: absolute; inset: 9% 7%; width: 86%; height: 82%; opacity: .5; pointer-events: none; }
.field-lines * { fill: none; stroke: var(--line-strong); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.empty-body { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 30rem; }

.quick-add { display: flex; gap: 6px; width: 100%; max-width: 26rem; }
.quick-add input { flex: 1; }

.embed-error > div { display: flex; flex-direction: column; gap: 10px; align-items: center; max-width: 28rem; }

.drawbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 10px; background: var(--raised); border-bottom: 1px solid var(--line-strong); }
.db-group { display: flex; gap: 2px; flex-wrap: wrap; }
.tool { display: inline-flex; flex-direction: column; align-items: center; gap: 1px; border: 0; background: transparent; color: var(--muted); padding: 4px 6px; border-radius: 5px; font-size: 11px; font-weight: 600; min-width: 40px; }
.tool svg { width: 18px; height: 18px; }
.tool:hover { color: var(--text); background: var(--sunk); }
.tool[aria-pressed="true"] { color: var(--text); background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line-strong); }
.swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; background: var(--c); box-shadow: inset 0 0 0 2px var(--raised); }
.swatch[aria-pressed="true"] { border-color: var(--text); }
.db-label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.db-label input { width: 4em; padding: 3px 6px; }
.db-time { color: var(--o); }
.ink-text { position: absolute; z-index: 6; transform: translate(-4px, -50%); width: 14em; background: rgba(9,13,15,.9); border-color: var(--o); font: 600 15px var(--font-body); }

/* timeline */
.timeline { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: center; }
.lane-labels { display: grid; grid-template-rows: repeat(3, 12px); gap: 3px; font: 700 10px/12px var(--font-display); letter-spacing: .06em; text-align: right; }
.lane-labels .o { color: var(--o); } .lane-labels .d { color: var(--d); } .lane-labels .p { color: var(--p); }
.track { position: relative; display: grid; grid-template-rows: repeat(3, 12px); gap: 3px; cursor: pointer; padding-block: 4px; touch-action: pan-y; }
.lane { position: relative; background: var(--sunk); border-radius: 3px; }
.lane[data-lane="S"], .lane-labels .s { display: none; }
.lane-labels .s { color: var(--good); }
.track.with-stats, .lane-labels.with-stats { grid-template-rows: repeat(4, 12px); }
.with-stats .lane[data-lane="S"], .lane-labels.with-stats .s { display: block; }
.st-span { position: absolute; top: 3px; bottom: 3px; border-radius: 2px; min-width: 2px; background: var(--line-strong); }
.st-span.good { background: rgba(123, 211, 137, .35); }
.st-span.bad { background: rgba(255, 107, 107, .35); }
.st-mark { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1px; border-radius: 1px; background: var(--text); }
.st-mark.good { background: var(--good); }
.st-mark.bad { background: var(--danger); }
.st-mark.their { background: var(--muted); }
.seg-clip { position: absolute; top: 0; bottom: 0; border-radius: 2px; min-width: 3px; background: var(--o); opacity: .85; }
.seg-clip.d { background: var(--d); } .seg-clip.p { background: var(--p); }
.seg-clip.pri-1 { opacity: .4; }
.seg-clip:hover { opacity: 1; }
.seg-clip.active { opacity: 1; box-shadow: 0 0 0 2px var(--text); }
.ink-mark { position: absolute; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; background: var(--text); transform: rotate(45deg); box-shadow: 0 0 0 1px var(--sunk); }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--text); left: 0; pointer-events: none; box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
.draft-range { position: absolute; top: 1px; bottom: 1px; border: 1.5px dashed var(--text); border-radius: 3px; background: rgba(255,255,255,.07); pointer-events: none; }
.hover-time { position: absolute; bottom: calc(100% + 2px); transform: translateX(-50%); background: var(--raised); border: 1px solid var(--line-strong); border-radius: 4px; padding: 1px 5px; pointer-events: none; white-space: nowrap; }

.transport { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.tp-group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.tbtn { min-width: 38px; height: 34px; border: 1px solid var(--line-strong); background: var(--raised); border-radius: var(--r); font: 600 14px var(--font-mono); display: inline-grid; place-items: center; padding: 0 8px; }
.tbtn:hover { border-color: var(--muted); }
.tbtn svg { width: 16px; height: 16px; }
.tbtn.play { width: 48px; background: var(--text); color: var(--bg); border-color: var(--text); }

.clock { font-size: 15px; white-space: nowrap; }
.speed { display: flex; align-items: center; gap: 6px; }

.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.toggle input { accent-color: var(--o); width: 15px; height: 15px; }
.btn.mark { border-color: var(--line-strong); }

/* ---------- panel ---------- */

.editor { border: 1px solid var(--line-strong); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 14px; background: var(--raised); box-shadow: inset 3px 0 0 var(--o); }

.list-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

.clips { display: flex; flex-direction: column; gap: 6px; }
.clip { border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px 6px; display: flex; flex-direction: column; gap: 4px; background: var(--bg); box-shadow: inset 3px 0 0 var(--o); }

.clip-main { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 0; text-align: left; width: 100%; }

/* report + reel */
.rep-head { display: flex; flex-direction: column; gap: 6px; }
.rep-head h2 { font: 700 30px/1.02 var(--font-display); letter-spacing: .01em; text-transform: uppercase; overflow-wrap: anywhere; }
.rep-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

.rep-sec.o h3 { color: var(--o); } .rep-sec.d h3 { color: var(--d); } .rep-sec.p h3 { color: var(--p); }

.must { font: 700 10px/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--danger); margin-left: 4px; white-space: nowrap; }
.pcard { border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
.pc-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.reel-go { display: flex; gap: 8px; flex-wrap: wrap; }
.btn.big { padding: 10px 16px; font-size: 15px; }
.reel-now { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--o); border-radius: 8px; background: var(--o-soft); }

.reel-meta { flex-basis: 100%; font-size: 12px; color: var(--muted); }
.queue { display: flex; flex-direction: column; gap: 2px; counter-reset: q; }

.queue button { display: grid; grid-template-columns: 2em auto auto minmax(0, 1fr); gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 5px; padding: 6px; font-size: 13px; }
.queue button::before { content: counter(q); font: 500 12px var(--font-mono); color: var(--faint); text-align: right; }
.queue button:hover { background: var(--raised); }
.queue li.now button { background: var(--raised); box-shadow: inset 2px 0 0 var(--o); }
.queue .q-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* dialog + toast */
dialog { background: var(--raised); color: var(--text); border: 1px solid var(--line-strong); border-radius: 10px; padding: 0; width: min(480px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }

.dlg-form { display: flex; flex-direction: column; gap: 14px; padding: 18px 20px 20px; }

.dlg-form input:not([type="checkbox"]):not([type="radio"]), .dlg-form select { width: 100%; }
.dlg-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
.check input { accent-color: var(--o); }
.row2 { display: grid; grid-template-columns: 6em minmax(0, 1fr); gap: 10px; }
.row2.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }

/* player profile */
.back { align-self: flex-start; font-size: 13px; color: var(--muted); }
.prof-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.prof-num { font: 700 40px/1 var(--font-display); font-variant-numeric: tabular-nums; min-width: 1.6em; text-align: center; padding: 8px 6px 6px; border: 2px solid var(--c, var(--line-strong)); border-radius: 8px; color: var(--text); }
.prof-head h2 { font: 700 30px/1 var(--font-display); letter-spacing: .01em; text-transform: uppercase; overflow-wrap: anywhere; }
.prof-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 13px; color: var(--muted); margin-top: 4px; }
.prof-stats { font-size: 13px; color: var(--muted); }
.prof-dot { width: 14px; align-self: stretch; min-height: 48px; border-radius: 5px; background: var(--c, var(--line-strong)); }
.team-link { border: 0; background: none; padding: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; text-align: left; cursor: pointer; }
.team-link:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.rep-sec h3 .spacer { flex: 1; }
.prof-btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.prof-btns .btn svg { width: 13px; height: 13px; }
body.profile-full { overflow: hidden; }
body.profile-full #panel { position: fixed; inset: 0; z-index: 45; overflow-y: auto; border: 0; background: var(--bg);
  padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, 4vw, env(safe-area-inset-right, 0px)) max(48px, env(safe-area-inset-bottom, 0px)) max(16px, 4vw, env(safe-area-inset-left, 0px)); }
body.profile-full .tprof { max-width: 1500px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 20px 32px; align-items: start; }
body.profile-full .tprof > :not(.rep-sec), body.profile-full .tprof > .tp-notes { grid-column: 1 / -1; }
body.profile-full .tprof > .back { justify-self: start; }
body.profile-full .tprof .prof-head h2 { font-size: clamp(32px, 4vw, 52px); }
body.profile-full .tp-notes .notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 10px; align-items: start; }
.prof-stats b { color: var(--text); font-variant-numeric: tabular-nums; }
.bars { display: flex; flex-direction: column; gap: 3px; }
.bar { display: grid; grid-template-columns: minmax(6em, 9em) minmax(0, 1fr) 2.2em; gap: 10px; align-items: center; font-size: 13px; border: 0; background: none; padding: 3px 4px; border-radius: 4px; text-align: left; }
.bar:hover { background: var(--raised); }
.bar .b-track { display: block; height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.bar .b-fill { display: block; height: 100%; background: var(--p); border-radius: 4px; opacity: .8; }
.bar .b-n { font: 500 12px var(--font-mono); color: var(--muted); text-align: right; }
.bar[aria-pressed="true"] { background: var(--p-soft); color: var(--p); }
.bar[aria-pressed="true"] .b-fill { opacity: 1; }
.game-group { display: flex; flex-direction: column; gap: 4px; }
.game-group h4 { font-size: 13px; font-weight: 600; color: var(--muted); }
.rep-list li.now .tc-link { background: var(--o); color: var(--on-o); }
.follow-chip { display: inline-flex; gap: 6px; align-items: center; background: var(--p-soft); color: var(--p); border: 1px solid var(--p); border-radius: 999px; padding: 2px 3px 2px 10px; font-weight: 600; font-size: 13px; }
.follow-chip .mini { color: var(--p); }
.player[aria-current="true"] { background: var(--raised); box-shadow: inset 2px 0 0 var(--p); }
.colours { display: flex; gap: 8px; flex-wrap: wrap; }
.colours label { position: relative; }
.colours input { position: absolute; opacity: 0; }
.colours span { display: block; width: 26px; height: 26px; border-radius: 50%; background: var(--c); border: 2px solid transparent; box-shadow: inset 0 0 0 2px var(--raised); cursor: pointer; }
.colours input:checked + span { border-color: var(--text); }
.colours input:focus-visible + span { outline: 2px solid var(--o); outline-offset: 2px; }
.err { color: var(--danger); font-size: 14px; }
.members { display: flex; flex-direction: column; gap: 4px; }
.members li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); }
.m-who { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 0 6px; align-items: baseline; }
.m-who small { flex-basis: 100%; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.menu-list { display: flex; flex-direction: column; gap: 8px; }
.gate { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px 16px; background: radial-gradient(ellipse at 50% 40%, #15232a 0%, var(--bg) 70%); overflow-y: auto; }
.gate[hidden] { display: none; }
.gate-card { width: min(100%, 420px); display: flex; flex-direction: column; gap: 16px; padding: 28px 24px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }

body.gated { overflow: hidden; }
.menu-list .btn { justify-content: center; min-height: 46px; }
.help { display: flex; flex-direction: column; gap: 10px; font-size: 14px; }

.keytable { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; }

.copybox { font: 13px/1.5 var(--font-mono); }

.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--text); color: var(--bg); font-weight: 600; font-size: 14px; padding: 9px 16px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 70; max-width: calc(100vw - 32px); text-align: center; }

/* ---------- playbook + coaching hub ---------- */
.hub { display: none; min-width: 0; overflow-y: auto; }
body:not([data-view="film"]) .desk { display: none; }
body:not([data-view="film"]) .hub { display: block; }
/* ---------- home, team pages, game plans, comments ---------- */
.tabbar .t-main, .tabbar .t-film { display: none; }
.hm-split { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(260px, 1fr); gap: 22px 36px; align-items: start; }
.hm-map { display: grid; gap: 8px; }
.hm-steps { display: flex; flex-direction: column; gap: 10px; counter-reset: step; }

.x-list .tc-link { border: 0; background: var(--o-soft); border-radius: 4px; padding: 1px 6px; color: var(--o); font-weight: 600; white-space: nowrap; flex: none; }

.cm { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 2px; padding: 8px 10px; border-left: 2px solid var(--line-strong); background: var(--bg); border-radius: 0 6px 6px 0; }

.news-cm { margin: 6px 0 14px; }
.tm-tabs { align-self: flex-start; max-width: 100%; }
.ro-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.ro-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto minmax(96px, auto); gap: 10px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); }
.ro-row:first-child { border-top: 0; }

.ro-name small { color: var(--faint); font-size: 13px; }

.ln-card { gap: 10px; }
.ln-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }

.pp-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 16px; }
.pp-title { flex: 1 1 280px; min-width: 0; font: 700 28px/1.1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; padding: 6px 10px; }
.ch-plan.pp-rows li { grid-template-columns: 3em 6.4em minmax(0, 1fr) auto; align-items: start; }
.pp-min { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 13px; }

.pp-what input { width: 100%; }
.pp-tools { display: inline-flex; gap: 2px; }
.pp-tools .mini:disabled { opacity: .3; }
.hub-page.gp { max-width: 980px; }
.gp textarea, .tm textarea { width: 100%; resize: vertical; }

.gp-match { display: flex; flex-direction: column; gap: 10px; }
.gp-match li { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(140px, 1fr); gap: 10px; align-items: center; }
.gp-them { display: flex; flex-direction: column; gap: 1px; min-width: 0; }

.gp-lines { display: flex; flex-direction: column; gap: 4px; }
@media print {
  :root { --bg: #fff; --surface: #fff; --raised: #fff; --sunk: #fff; --text: #000; --muted: #333; --faint: #555; --line: #bbb; --line-strong: #999; --o: #000; --o-soft: transparent; --d: #000; --good: #000; }
  html, body { height: auto; background: #fff; color: #000; }
  .app { display: block; height: auto; }
  .topbar, .tabbar, .toast, .gate, .no-print, dialog { display: none !important; }
  .hub { display: block !important; overflow: visible !important; }
  .hub-page { padding: 0; max-width: none; }
  .hub-sec { break-inside: avoid; }
  .gp textarea, .gp input { border: 0; padding: 0; resize: none; overflow: hidden; background: none; }
  .gp textarea:placeholder-shown, .gp input:placeholder-shown, .gp .chip:not(.on) { display: none; }
  .gp .tc-link { background: none; padding: 0; }
}
/* ---------- team activity ---------- */
.hub-page.av { max-width: 1080px; }

.av-row { display: grid; grid-template-columns: minmax(170px, 1.8fr) repeat(6, minmax(56px, 1fr)); align-items: center; gap: 0 8px; padding: 10px 16px; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; }

.av-cols { border-top: 0; padding-top: 6px; padding-bottom: 8px; font: 600 12px/1.2 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.av-cols span:not(:first-child) { text-align: right; }
.av-person:hover { background: var(--raised); }
.av-who { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.av-games { display: flex; flex-direction: column; gap: 12px; }

.av-game-top { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.av-game-title { font: 700 20px/1.1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; text-decoration: none; text-align: left; overflow-wrap: anywhere; }

.av-covs { display: flex; flex-direction: column; gap: 7px; }

.av-name { text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.av-pct { text-align: right; font-size: 13px; }

.av-film { display: flex; flex-direction: column; gap: 14px; }

.av-film .hub-sub { font-size: 14px; }
.av-days { display: grid; grid-template-columns: repeat(28, minmax(0, 1fr)); gap: 3px; max-width: 620px; }
.av-days i, .av-key i { display: block; aspect-ratio: 1; border-radius: 3px; background: var(--sunk); border: 1px solid var(--line); }
.av-days i.on, .av-key i.on { border-color: var(--d); }
.av-days i.l1, .av-key i.l1 { background: rgba(76, 201, 240, .28); }
.av-days i.l2, .av-key i.l2 { background: rgba(76, 201, 240, .6); }
.av-days i.l3, .av-key i.l3 { background: var(--d); }
.av-key { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.av-key span { display: inline-flex; align-items: center; gap: 6px; }
.av-key i { width: 12px; }
.av-list { display: flex; flex-direction: column; gap: 9px; }
.av-list li { display: flex; gap: 10px; align-items: baseline; }
.av-list li > span { min-width: 0; overflow-wrap: anywhere; }
.av-list small { display: block; color: var(--faint); font-size: 13px; }
.av-list .tc-link { border: 0; background: var(--o-soft); border-radius: 4px; padding: 1px 6px; color: var(--o); font-weight: 600; white-space: nowrap; flex: none; }
.av-list .tc-link:hover { background: var(--o); color: var(--on-o); }
.av-foot { max-width: 80ch; }
.modes .sep { width: 1px; background: var(--line-strong); margin: 5px 5px; }
.hub-page { max-width: 1320px; margin: 0 auto; padding: 22px 24px 56px; display: flex; flex-direction: column; gap: 18px; }
.hub-head { display: flex; align-items: flex-end; gap: 12px 20px; flex-wrap: wrap; }
.hub-head > div:first-child { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.hub h2 { font: 700 34px/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; overflow-wrap: anywhere; }
.hub-sub { color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.hub-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.hub-split { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(300px, 1fr); gap: 22px 36px; align-items: start; }
.hub-main { min-width: 0; display: flex; flex-direction: column; gap: 10px; }

.hub-empty p { color: var(--muted); max-width: 56ch; }
.hub-empty .hub-actions { justify-content: center; }

/* the field */
.fd { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.fd-wrap { width: 100%; margin: 0 auto; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: #0f2118; }
.fd-wrap.fv-end { max-width: calc(66vh * .81); }
.fd-wrap.fv-half, .fd-wrap.fv-back { max-width: calc(70vh * .57); }
.fd-wrap.fv-full { max-width: calc(80vh * .38); }
.fd-wrap.editing { touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }
.fd-svg { display: block; width: 100%; height: auto; }
.fd-grass { fill: #12281d; }
.fd-ez { fill: #18382a; }
.fd-line { stroke: rgba(255, 255, 255, .38); stroke-width: .3; }
.fd-brick { stroke: rgba(255, 255, 255, .38); stroke-width: .3; stroke-linecap: round; }
.fd-area { fill: rgba(255, 255, 255, .08); stroke: rgba(255, 255, 255, .42); stroke-dasharray: 1.2 1; }
.fd-text { fill: #e9f1ec; font-family: var(--font-display); font-weight: 600; letter-spacing: .04em; paint-order: stroke; stroke: #0f2118; stroke-width: .7; stroke-linejoin: round; }
.fd-cut path, .fd-throw path { stroke-linecap: round; stroke-linejoin: round; }
.fd-cut-o path { stroke: var(--o); } .fd-cut-o polygon { fill: var(--o); }
.fd-cut-d path { stroke: var(--d); } .fd-cut-d polygon { fill: var(--d); }
.fd-throw path { stroke: #fff; } .fd-throw polygon { fill: #fff; }
.fd-cut path.fd-hit, .fd-throw path.fd-hit { stroke: transparent; stroke-dasharray: none; pointer-events: stroke; }
.fd-o { fill: var(--o); }
.fd-d { fill: var(--d); }
.fd-disc { fill: #fff; stroke: #0f2118; }
.fd-ring { stroke: var(--p); }
.fd-pad { fill: transparent; }
.fd-lab { font-family: var(--font-display); font-weight: 700; pointer-events: none; }
.fd-lab-o { fill: var(--on-o); } .fd-lab-d { fill: var(--on-d); }
.fd-ghost { stroke: #fff; opacity: .7; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.fd-wrap.editing .fd-tok, .fd-wrap.editing [data-mark] { cursor: grab; }
.fd-tok.sel .fd-o, .fd-tok.sel .fd-d, .fd-tok.sel .fd-disc { stroke: #fff; stroke-width: .5; }
.fd-area.sel { stroke: #fff; fill: rgba(255, 255, 255, .16); }
.fd-text.sel { fill: #fff; text-decoration: underline; }
.fd-cut.sel path:not(.fd-hit), .fd-throw.sel path:not(.fd-hit) { filter: drop-shadow(0 0 .7px #fff) drop-shadow(0 0 .7px #fff); }
.fd-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fd-bar .mini { font-size: 20px; line-height: 1; padding: 2px 10px 4px; }
.fd-bar .mini:disabled { opacity: .3; cursor: default; }
.fd-count { font: 500 13px var(--font-mono); color: var(--muted); }
.fd-note { min-height: 2.9em; font-size: 16px; }
.fd-note:empty::before { content: "Press play to watch it move."; color: var(--faint); }

/* playbook */
.pb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.pb-card { display: flex; flex-direction: column; text-align: left; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.pb-card:hover { border-color: var(--muted); }
.pb-thumb { display: block; height: 190px; background: #0f2118; }
.pb-thumb .fd-svg { width: 100%; height: 100%; }
.pb-card-text { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; padding: 12px 14px 14px; }
.pb-card-text strong { font: 700 20px/1.1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; overflow-wrap: anywhere; }
.pb-cats { align-self: flex-start; }
.pb-notes { white-space: pre-wrap; overflow-wrap: anywhere; }
.pb-clips { display: flex; flex-direction: column; gap: 8px; }
.pb-clips li { display: flex; flex-direction: column; gap: 3px; }

.pb-clip .tc { color: var(--o); white-space: nowrap; }
.pb-teams { display: flex; flex-wrap: wrap; gap: 6px; }

.pb-tools { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }

.pb-tip { min-height: 1.5em; }
.pb-sel { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--raised); border: 1px solid var(--line-strong); border-radius: var(--r); padding: 6px 10px; }
.pb-sel input { width: auto; flex: 0 1 12em; }
.pb-sel #pbTokLabel { flex: 0 0 4em; text-align: center; }
.pb-steps { flex-direction: column; align-items: stretch; }
.pb-step-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pb-steps .mini { font-size: 13px; padding: 4px 8px; }
.pb-step-row .chip { min-width: 32px; padding: 4px 10px; }
.pb-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pb-editor .hub-side { gap: 14px; }

/* coaching hub: the front page */

/* coaching hub: one page */
.hub-page.ch { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 0 36px; align-items: start; }
.ch-nav { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.ch-group { display: flex; flex-direction: column; gap: 2px; }
.ch-group .eyebrow { padding: 0 10px 4px; }
.ch-link { display: flex; align-items: center; gap: 8px; text-align: left; border: 0; background: none; border-radius: 6px; padding: 6px 10px; color: var(--muted); font-weight: 500; }
.ch-link span:first-child { flex: 1; }

  /* Transport: big buttons in rows a thumb can hit. */

  .transport > .spacer { display: none; }
  .tp-seek { grid-area: seek; display: grid; grid-template-columns: 1fr 1fr 1.35fr 1fr 1fr 1fr; gap: 6px; }
  .tp-cc { grid-area: cc; height: 44px; }
  .tp-ytc { grid-area: ytc; width: 44px; height: 44px; padding: 0; }
  .tp-ytc svg { width: 20px; height: 20px; }
  .tp-seek .tbtn, .tbtn.play { width: auto; height: 50px; font-size: 15px; }
  .tbtn.play svg { width: 20px; height: 20px; }
  .clock { grid-area: clock; font-size: 16px; }
  .speed { grid-area: speed; justify-self: end; }
  .speed select { height: 44px; padding-inline: 10px; }
  .tp-full { grid-area: full; height: 44px; gap: 6px; padding: 0 12px; display: inline-flex; font: 600 14px var(--font-body); }
  .tbtn .lbl { display: inline; }
  .tp-mark { grid-area: mark; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tp-mark .btn { height: 50px; justify-content: center; font-size: 15px; }
  .tp-mark .mark-cancel { grid-column: 1 / -1; height: 44px; }
  .toggle { grid-area: toggle; justify-self: start; padding: 4px 0; }

  .tabbar { display: grid !important; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line);
    padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  .tabbar button { border: 0; background: none; color: var(--muted); min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 600 13px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; }
  .tabbar svg { width: 22px; height: 22px; }
  .tabbar button[aria-current="page"] { color: var(--o); box-shadow: inset 0 2px 0 var(--o); }
  .toast { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  body.full .toast { bottom: auto; top: max(16px, env(safe-area-inset-top, 0px)); }
  .caption { --fade: 16px; padding: 6px 10px var(--fade); }
  .cap-note { font-size: 14px; }
  .drawbar { gap: 8px; padding: 8px; }
  .drawbar .db-group:first-child { flex-wrap: nowrap; overflow-x: auto; max-width: calc(100vw - 20px); scrollbar-width: none; }
  .drawbar .tool { flex: none; }
  dialog { max-height: calc(100dvh - 32px); }
}
@media (max-width: 820px), (pointer: coarse) and (max-height: 520px) {

  .av-none { grid-column: 1 / -1; text-align: left; }

  .hub-page { padding: 16px 14px 32px; gap: 14px; }

  .ch-search { font-size: 16px; max-width: none; }
  .ch-secs { display: flex; flex-wrap: nowrap; overflow-x: auto; }

  .ch-filter .chip { min-height: 34px; }
  .ch-results { gap: 24px; }
  .ch-cards { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .ch-card { padding: 12px 14px; }
  .ch-card-blurb { -webkit-line-clamp: 2; }
  .ch-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .ch-tile-eg { display: none; }
  .ch-plan li { grid-template-columns: 2.6em 3.8em minmax(0, 1fr); gap: 0 8px; }
  .ch-pager .btn.small { min-height: 40px; }
  .fd-wrap.fv-end { max-width: calc(58vh * .81); }
  .fd-wrap.fv-half, .fd-wrap.fv-back { max-width: calc(60vh * .57); }
  .fd-wrap.fv-full { max-width: calc(68vh * .38); }
  .fd-wrap.editing.fv-half, .fd-wrap.editing.fv-back { max-width: calc(66vh * .57); }
  .fd-bar .btn.small, .hub-actions .btn.small { min-height: 40px; padding: 6px 14px; font-size: 14px; }
  .fd-bar .mini { min-width: 44px; min-height: 40px; }
  .pb-tool { min-height: 40px; padding: 6px 12px; }
  .pb-steps .mini, .pb-step-row .chip { min-height: 38px; }
  .pb-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .pb-thumb { height: 150px; }
  .pb-card-text strong { font-size: 17px; }
  .pb-clip { padding: 8px 0; }
  .pb-editor .hub-head { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0; }
  .pb-editor .hub-head > div:first-child { flex-basis: 0; }
}
@media (max-width: 820px) and (orientation: portrait) {
  .video-wrap { position: sticky; top: 0; z-index: 20; }
}
@media (pointer: coarse) {
  input, select, textarea, .chip-input { font-size: 16px; } /* smaller text makes iPhones zoom in on every tap */
  .btn.small { padding: 7px 12px; font-size: 14px; }
  .mini { padding: 8px 10px; font-size: 14px; }
  .seg button { padding: 9px 12px; font-size: 14px; }

  .track, .lane-labels { grid-template-rows: repeat(3, 15px); }

}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="#ffd23f" stroke-width="2.5"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="#ffd23f" stroke-width="1.2" opacity=".55"/><circle cx="16" cy="16" r="2.5" fill="#ffd23f"/></svg>
      <span class="brand-name">Film Room</span>
      <input id="division" class="division" aria-label="Tournament or division name" maxlength="60">
    </div>
    <nav class="modes" role="tablist" aria-label="View">
      <button role="tab" data-go="home">Home</button>
      <span class="sep" aria-hidden="true"></span>
      <button role="tab" data-mode="study">Study</button>
      <button role="tab" data-mode="reel">Highlight reel</button>
      <button role="tab" data-mode="report">Scouting report</button>
      <span class="sep" aria-hidden="true"></span>
      <button role="tab" data-go="stats">Stats</button>
      <button role="tab" data-go="plans">Game plans</button>
      <button role="tab" data-go="playbook">Playbook</button>
      <button role="tab" data-go="coach">Coaching hub</button>
      <button role="tab" data-go="team">Team</button>
    </nav>
    <div class="me">
      <label class="me-name"><span class="eyebrow">You</span><input id="myName" placeholder="Your name" autocomplete="given-name" maxlength="40"></label>
      <button class="btn icon-btn" data-act="news" title="Clips your teammates added" aria-label="What's new"><svg class="phone-only" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M5 8a5 5 0 0110 0v4l1.5 2.5h-13L5 12z"/><path d="M8 17a2 2 0 004 0"/></svg><span class="lbl-long">What's new</span> <span class="badge" id="newsBadge" hidden></span></button>
      <button class="btn primary" data-act="teamRoom" id="bTeam" hidden>Join team</button>
      <button class="btn desk-only" data-act="export" id="bExport" title="Save all notes to a file, as a backup or to send to the group">Export</button>
      <button class="btn desk-only" data-act="import" id="bImport" title="Merge a teammate's exported file into yours">Import</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <button class="btn desk-only" data-act="help" aria-label="How it works">?</button>
      <button class="btn icon-btn phone-only" data-act="menu" aria-label="Menu: your name, export, import, help"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3.5 5.5h13M3.5 10h13M3.5 14.5h13"/></svg><span class="needs-dot" id="menuDot" hidden></span></button>
      <span class="status" id="status"><span class="sync-dot"></span><span id="statusText">Saved on this device</span></span>
    </div>
  </header>

  <div class="desk">
    <aside class="rail" id="rail" aria-label="Opponents"></aside>

    <main class="stage">

          <div class="empty" id="emptyStage" hidden></div>
          <div class="embed-error" id="embedError" hidden></div>
          <div class="seek-flash" id="seekFlash" aria-hidden="true"></div>
        </div>
        <div class="fs-ui" id="fsUi">
          <button class="fs-exit" data-act="full" aria-label="Exit full screen" title="Exit full screen (F)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M5.5 1.5v4h-4M14.5 5.5h-4v-4M10.5 14.5v-4h4M1.5 10.5h4v4"/></svg></button>
          <div class="fs-bottom" id="fsBottom">
            <div class="fs-draft" id="fsDraft" hidden></div>
            <div id="fsTimelineSlot"></div>
            <div class="fs-row">
              <div class="fs-group">
                <button class="fs-btn" data-act="reelPrev" data-reel aria-label="Previous clip" title="Previous clip (P)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 2.5h2v11H3zM14 2.5v11L6 8z"/></svg></button>
                <button class="fs-btn" data-act="seek" data-v="-5" aria-label="Back 5 seconds">−5</button>
                <button class="fs-btn play" data-act="play" id="fsPlay" aria-label="Play"></button>
                <button class="fs-btn" data-act="seek" data-v="5" aria-label="Forward 5 seconds">+5</button>
                <button class="fs-btn" data-act="seek" data-v="20" aria-label="Forward 20 seconds">+20</button>
                <button class="fs-btn" data-act="reelNext" data-reel aria-label="Next clip" title="Next clip (N)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M11 2.5h2v11h-2zM2 2.5v11L10 8z"/></svg></button>
                <span class="fs-clock mono" id="fsClock"></span>
              </div>
              <div class="fs-group">
                <button class="fs-btn" data-act="stFloat" id="fsStats" aria-pressed="false" title="Stats window over the video (S)">Stats</button>
                <button class="fs-btn" data-act="ytc" aria-pressed="false" aria-label="Quality" title="Quality: show YouTube's own controls"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
                <button class="fs-btn cc" data-act="cc" aria-pressed="false" title="Subtitles (C)">CC</button>

                <button class="fs-btn" data-act="markIn" title="Start a clip here (I)">In</button>
                <button class="fs-btn" data-act="markOut" title="End the clip here (O)">Out</button>
                <button class="fs-btn draw" data-act="draw" title="Pause and draw (D)">Draw</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="timeline">
        <div class="lane-labels" aria-hidden="true"><span class="o">O</span><span class="d">D</span><span class="p">P</span><span class="s" title="Stats">S</span></div>

          <div class="lane" data-lane="D"></div>
          <div class="lane" data-lane="P"></div>

          <div class="draft-range" id="draftRange" hidden></div>
          <div class="playhead" id="playhead"></div>
          <div class="hover-time mono" id="hoverTime" hidden></div>
        </div>
      </div>

      <div class="transport">
        <div class="tp-group tp-seek">
          <button class="tbtn" data-act="seek" data-v="-5" title="Back 5 seconds (J)">−5</button>
          <button class="tbtn" data-act="seek" data-v="-1" title="Back 1 second">−1</button>

          <button class="tbtn" data-act="seek" data-v="5" title="Forward 5 seconds (L)">+5</button>
          <button class="tbtn" data-act="seek" data-v="20" title="Forward 20 seconds">+20</button>
        </div>
        <div class="clock mono"><span id="tNow">0:00.0</span> <span class="muted">/ <span id="tDur">0:00</span></span></div>

          <select id="speed">
            <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option>
          </select>
        </label>
        <button class="tbtn tp-ytc" data-act="ytc" aria-pressed="false" aria-label="Quality" title="Show YouTube's own controls, to pick the picture quality from its gear menu"><svg class="phone-only" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg><span class="lbl-long">Quality</span></button>

        <button class="tbtn tp-full" data-act="full" title="Full screen (F)" aria-label="Full screen"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 5.5v-4h4M10.5 1.5h4v4M14.5 10.5v4h-4M5.5 14.5h-4v-4"/></svg><span class="lbl">Full screen</span></button>
      </div>
      <p class="keys"><kbd>Space</kbd> play · <kbd>J</kbd><kbd>L</kbd> ±5s · <kbd>←</kbd><kbd>→</kbd> ±10s · <kbd>,</kbd><kbd>.</kbd> step · <kbd>[</kbd><kbd>]</kbd> speed · <kbd>I</kbd><kbd>O</kbd> mark · <kbd>D</kbd> draw · <kbd>C</kbd> subtitles · <kbd>F</kbd> full screen</p>

function reelMatches() {

  return live('clips').filter(c => {
    if (!gameLive(c.gameId)) return false;
    if (f.teamId !== 'all' && c.teamId !== f.teamId) return false;
    if (f.side !== 'all' && c.side !== f.side) return false;
    if ((c.priority || 2) < f.minPri) return false;
    if (f.verdict && f.verdict !== 'all' && verdictOf(c) !== f.verdict) return false;
    if (f.playId && !(c.playIds || []).includes(f.playId)) return false;
    if (f.tags.length && !f.tags.some(t => (c.tags || []).includes(t))) return false;
    if (f.players.length && !f.players.some(p => (c.playerIds || []).includes(p))) return false;

function mergePack(inc) {
  const st = { clipsNew: 0, clipsUpd: 0, players: 0, games: 0, teams: 0 };
  const newer = (a, b) => (a.updatedAt || 0) > (b.updatedAt || 0);
  const teamMap = {}, playerMap = {}, gameMap = {};

  for (const t of Object.values(inc.teams || {})) {
    let id = t.id;
    const byName = live('teams').find(x => norm(x.name) === norm(t.name));
    if (byName) id = byName.id;
    else if (db.teams[id] && !db.teams[id].deleted && db.teams[id].updatedAt > 0 && t.updatedAt > 0 && norm(db.teams[id].name) !== norm(t.name)) id = uid('team');
    teamMap[t.id] = id;
    const cur = db.teams[id];
    if (!cur) { db.teams[id] = { ...t, id, order: t.order ?? 99 }; if (!t.deleted) st.teams++; }
    else if (newer(t, cur)) db.teams[id] = { ...t, id };
  }
  for (const p of Object.values(inc.players || {})) {
    const teamId = teamMap[p.teamId] || p.teamId;
    let id = p.id;
    if (!db.players[id]) {
      const m = live('players').find(x => x.teamId === teamId && norm(x.name) === norm(p.name) && String(x.number ?? '') === String(p.number ?? ''));
      if (m) id = m.id;
    }
    playerMap[p.id] = id;
    const cur = db.players[id], np = { ...p, id, teamId };
    if (!cur) { db.players[id] = np; if (!p.deleted) st.players++; }
    else if (newer(p, cur)) db.players[id] = np;
  }
  for (const g of Object.values(inc.games || {})) {
    const teamIds = (g.teamIds || []).map(x => teamMap[x] || x);
    let id = g.id;
    if (!db.games[id]) { const m = live('games').find(x => x.videoId === g.videoId); if (m) id = m.id; }
    gameMap[g.id] = id;
    const cur = db.games[id];
    if (!cur) { db.games[id] = { ...g, id, teamIds }; if (!g.deleted) st.games++; }
    else {
      const winner = newer(g, cur) ? { ...g, id } : cur;
      winner.teamIds = [...new Set([...(cur.teamIds || []), ...teamIds])];
      if (winner.autoTitle && !(g.autoTitle && cur.autoTitle)) { const named = g.autoTitle ? cur : g; winner.title = named.title; winner.autoTitle = false; }
      db.games[id] = winner;
    }
  }
  for (const c of Object.values(inc.clips || {})) {
    const nc = { ...c, gameId: gameMap[c.gameId] || c.gameId, teamId: teamMap[c.teamId] || c.teamId, playerIds: (c.playerIds || []).map(x => playerMap[x] || x) };
    const cur = db.clips[c.id];
    if (!cur) { db.clips[c.id] = nc; if (!c.deleted) st.clipsNew++; }
    else if (newer(c, cur)) { db.clips[c.id] = nc; st.clipsUpd++; }
  }
  for (const n of Object.values(inc.notes || {})) {
    const cur = db.notes[n.id];
    if (!cur || newer(n, cur)) db.notes[n.id] = { ...n, teamId: teamMap[n.teamId] || n.teamId };
  }
  cmCache = null;
  for (const coll of ['plays', 'coach', 'x']) for (const x of Object.values(inc[coll] || {})) {
    const cur = x && x.id && db[coll][x.id];
    if (x && x.id && (!cur || newer(x, cur))) db[coll][x.id] = x;
  }
  db.customTags = [...new Set([...(db.customTags || []), ...(inc.customTags || [])])];
  if ((inc.divisionAt || 0) > (db.divisionAt || 0)) { db.division = inc.division; db.divisionAt = inc.divisionAt; }
  save();
  return st;
}
function exportPack() {
  const pack = { ...db, app: 'film-room', exportedBy: me || '', exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(pack)], { type: 'application/json' });
  const a = document.createElement('a');

  a.download = `film-room-${slug(db.division)}${me ? '-' + slug(me) : ''}-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);

  toast(`Exported ${n} clip${n === 1 ? '' : 's'}. Send the file to your group.`);
}
async function importFile(file) {
  try {
    const data = JSON.parse(await file.text());
    if (data && data.app === 'ultimate-tracker' && Array.isArray(data.games)) { utImportDialog(data); return; }
    if (!data || data.v !== 1 || !data.clips || !data.teams) throw new Error('not a pack');
    const st = mergePack(data);
    fixSelection();
    if (ui.gameId && ui.loadedGameId !== ui.gameId) selectGame(ui.gameId); else renderAll();
    const who = data.exportedBy ? `${data.exportedBy}'s notes` : 'the file';
    const n = (k, word) => `${k} ${word}${k === 1 ? '' : 's'}`;
    toast(`Merged ${who}: ${n(st.clipsNew, 'new clip')}, ${st.clipsUpd} updated, ${n(st.games, 'new game')}, ${n(st.players, 'new player')}.`);
  } catch {
    toast('That file is not a Film Room export or an Ultimate Tracker file.');
  }
}

/* ---- sign-in and team access ----
   Everyone signs in with Google. The organiser adds each teammate's Google email to the room, and only the
   emails on that list can read or write it. The database rules enforce this (see firestore.rules). */
let fbPromise = null, fb = null; // fb is set once loaded, so sign-in can open its window straight from a tap
function firebase() {
  return fbPromise ||= (async () => {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_SDK}`;
    const [{ initializeApp }, F, A] = await Promise.all([import(`${base}/firebase-app.js`), import(`${base}/firebase-firestore.js`), import(`${base}/firebase-auth.js`)]);
    // ?profile= gets its own sign-in and cache, so one browser can play two teammates when testing.
    const app = initializeApp(FIREBASE_CONFIG, PROFILE ? `p-${PROFILE}` : '[DEFAULT]');
    let fs;
    try { fs = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
    catch { fs = F.getFirestore(app); }

}

function signIn() {
  if (!fb) return Promise.reject(Object.assign(new Error('loading'), { code: 'loading' }));
  const provider = new fb.A.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  return fb.A.signInWithPopup(fb.auth, provider).then(cred => cred.user);
}
// The code in brackets says exactly what went wrong when someone reports a problem.
function teamError(e) {
  const msg = {
    loading: 'Still loading. Try again in a second.',
    'not-found': 'That team room no longer exists.',
    'permission-denied': 'The team database did not let this account in. Ask your organiser to check they added this exact Google email.',
    unavailable: 'Could not reach the team database. Check your connection and try again.',
    'auth/popup-closed-by-user': 'The sign-in window was closed before you finished.',
    'auth/cancelled-popup-request': 'The sign-in window was closed before you finished.',
    'auth/popup-blocked': 'Your browser blocked the sign-in window. Allow pop-ups for this site and try again.',
    'auth/unauthorized-domain': 'Sign-in only works from the normal Film Room link.',
    'auth/network-request-failed': 'The sign-in window could not reach Google. Open this page in Safari or Chrome (not inside a chat app) and try again.',
    'auth/web-storage-unsupported': 'This browser blocks sign-in. Open the page in Safari or Chrome.',
    'auth/operation-not-supported-in-this-environment': 'This browser blocks sign-in. Open the page in Safari or Chrome.',

}
function setMe(name) {

// Remember the room. Switching to a different team's room starts clean here; the old room's notes stay in the cloud.
function adoptRoom(room) {
  const prev = store.get(KEY_ROOM);
  if (prev && prev !== room) {
    db = freshDb(); ui.draft = null; store.set(KEY, JSON.stringify(db));
    sync.synced = noneSynced();
    renderAll();
  }
  sync.room = room; store.set(KEY_ROOM, room);

}

const inChatApp = () => /FBAN|FBAV|Instagram|WhatsApp|Messenger|Snapchat|Line\/|GSA\//i.test(navigator.userAgent);

      <div class="gate-actions"><button type="button" class="btn primary big" data-act="gateSignIn">Sign in with Google</button></div>
      ${inChatApp() ? '<p class="hint">Opened this from a chat app? Google blocks sign-in inside those. Open the page in Safari or Chrome instead.</p>' : ''}`,
    noaccess: `<p>You are signed in as <b>${email}</b>, but no team has added you yet.</p>
      <p class="muted">Send this email to your organiser. Once they add it under <b>Team</b>, press Check again.</p>
      <div class="gate-actions"><button type="button" class="btn primary" data-act="gateCheck">Check again</button><button type="button" class="btn" data-act="gateCopyEmail">Copy my email</button></div>
