async function afterSignIn(user) {
  team.user = user;
  if (!me && user.displayName) setMe(user.displayName.split(' ')[0]);
  gate('loading');
  let rooms;
  try { rooms = await findRooms(); }
  catch (e) { console.error(e); gate('noaccess', { error: teamError(e) }); return; }
  const want = store.get(KEY_ROOM) || roomFromText(location.hash);
  const pick = rooms.find(r => r.room === want) || (rooms.length === 1 ? rooms[0] : null);
  if (pick) openRoom(pick.room);
  else gate(rooms.length ? 'pick' : 'noaccess', { rooms });
}
async function findRooms() {
  const { F, fs } = fb, email = emailOf(team.user), found = new Map();
  let listError = null;
  if (email) {
    try {
      const snap = await F.getDocs(F.query(F.collection(fs, 'access'), F.where('email', '==', email)));
      snap.forEach(d => found.set(d.data().room, d.data()));
    } catch (e) { listError = e; }
  }
  // Rooms from before email access: the one this device used, or one in an old invite link, still open
  // for their organiser and for anyone already let in. The organiser's next visit moves them onto the list.
  for (const room of new Set([store.get(KEY_ROOM), roomFromText(location.hash)])) {
    if (!room || found.has(room)) continue;
    try {
      const rs = await F.getDoc(F.doc(fs, 'rooms', room));
      if (!rs.exists()) continue;
      const own = rs.data().owner === team.user.uid;
      const ms = own ? null : await F.getDoc(F.doc(fs, 'rooms', room, 'members', team.user.uid));
      if (own || ms?.data()?.status === 'approved') found.set(room, { room, ownerName: rs.data().ownerName });
    } catch (e) { console.warn(e); }
  }
  if (!found.size && listError) throw listError;
  return [...found.values()];
}
async function openRoom(room) {
  const { F, fs } = fb;
  gate('loading');
  try {
    const rs = await F.getDoc(F.doc(fs, 'rooms', room));
    if (!rs.exists()) throw Object.assign(new Error('no room'), { code: 'not-found' });
    Object.assign(team, { owner: rs.data().owner, ownerName: rs.data().ownerName || 'the organiser' });
  } catch (e) { console.error(e); gate('noaccess', { error: teamError(e) }); return; }
  adoptRoom(room);
  gate(null);
  startSync(room);
  if (isOrganiser()) watchPeople(room);
  renderTeamButton();
}
async function createRoom() {
  const { F, fs } = fb, u = team.user, room = newRoomId();
  gate('loading');
  try {
    const ownerName = me || u.displayName || 'the organiser';
    await F.setDoc(F.doc(fs, 'rooms', room), { owner: u.uid, ownerName, createdAt: Date.now() });
    Object.assign(team, { owner: u.uid, ownerName });
    await addPeople(room, [{ email: emailOf(u), name: me }]);
  } catch (e) { console.error(e); gate('noaccess', { error: teamError(e) }); return; }
  await openRoom(room);
  toast('Team room ready. Press Team to add your teammates\' Google emails.');
}

/* ---- the organiser's list ---- */
function watchPeople(room) {
  const { F, fs } = fb;
  team.unsub.forEach(f => f()); team.unsub = [];
  team.people = team.legacy = null;
  const sorted = s => s.docs.map(d => d.data()).sort((a, b) => (a.at || 0) - (b.at || 0));
  team.unsub.push(F.onSnapshot(F.collection(fs, 'rooms', room, 'people'), s => { team.people = sorted(s); moveLegacy(room); refreshTeamDialog(); }, err => console.error(err)));
  team.unsub.push(F.onSnapshot(F.collection(fs, 'rooms', room, 'members'), s => { team.legacy = s.docs.map(d => ({ uid: d.id, ...d.data() })); moveLegacy(room); refreshTeamDialog(); }, err => console.error(err)));
}
// The organiser, and everyone let in before email access existed, go onto the list once, so nobody is locked out.
function moveLegacy(room) {
  if (!team.people || !team.legacy) return;
  const have = new Set(team.people.map(p => p.email));
  const want = [{ email: emailOf(team.user), name: me }, ...team.legacy.filter(m => m.status === 'approved').map(m => ({ email: (m.email || '').toLowerCase(), name: m.name }))]
    .filter((p, i, all) => p.email && !have.has(p.email) && !team.adding.has(p.email) && all.findIndex(q => q.email === p.email) === i);
  if (!want.length) return;
  want.forEach(p => team.adding.add(p.email));
  addPeople(room, want).catch(e => console.error(e)).finally(() => want.forEach(p => team.adding.delete(p.email)));
}
async function addPeople(room, list) {
  const { F, fs } = fb, batch = F.writeBatch(fs), at = Date.now();
  for (const p of list) {
    batch.set(F.doc(fs, 'rooms', room, 'people', p.email), { email: p.email, name: p.name || '', at, addedBy: me || '' });
    batch.set(F.doc(fs, 'access', accessId(room, p.email)), { email: p.email, room, ownerName: team.ownerName, at });
  }
  await batch.commit();
}
async function removePerson(email) {
  const { F, fs } = fb, room = sync.room, batch = F.writeBatch(fs);
  batch.delete(F.doc(fs, 'rooms', room, 'people', email));
  batch.delete(F.doc(fs, 'access', accessId(room, email)));
  for (const m of team.legacy || []) {
    if ((m.email || '').toLowerCase() === email && m.status !== 'removed' && m.uid !== team.user.uid) batch.update(F.doc(fs, 'rooms', room, 'members', m.uid), { status: 'removed', at: Date.now() });
  }
  await batch.commit();
}
async function signOutHere() {
  team.unsub.forEach(f => f()); team.unsub = [];
  stopSync();
  const { A, F, auth, fs } = fb;
  await A.signOut(auth).catch(() => {});
  try { await F.terminate(fs); await F.clearIndexedDbPersistence(fs); } catch { /* best effort */ }
  for (const k of [KEY, KEY_ROOM, KEY_SEEN, KEY_POS, KEY_UI, KEY_ACT, KEY_AI]) { try { localStorage.removeItem(k); } catch {} }
  location.replace(`${location.pathname}${location.search}`);
}

async function firestoreBackend(room) {
  const { F, fs } = await firebase();
  return {
    listen(coll, onDocs, onError) {
      return F.onSnapshot(F.collection(fs, 'rooms', room, coll), { includeMetadataChanges: true }, snap => {
        // Include changes that only flip "pending" to "saved": tabs on one device share a cache, so a
        // teammate tab's write first shows up here as pending and must be picked up once it is confirmed.
        const docs = snap.docChanges({ includeMetadataChanges: true }).filter(ch => ch.type !== 'removed').map(ch => ({ id: ch.doc.id, data: ch.doc.data(), local: ch.doc.metadata.hasPendingWrites }));
        onDocs(docs, snap.metadata.fromCache);
      }, onError);
    },
    async get(coll, id) {
      const snap = await F.getDoc(F.doc(fs, 'rooms', room, coll, id));
      return snap.data()?.j;
    },
    async commit(writes) {
      for (let i = 0; i < writes.length; i += 400) {
        const batch = F.writeBatch(fs);
        for (const w of writes.slice(i, i + 400)) batch.set(F.doc(fs, 'rooms', room, w.coll, w.id), w.data);
        await batch.commit();
      }
    },
  };
}
function devBackend(room) {
  const key = `filmroom.devsync.${room}`, chan = new BroadcastChannel(key), listeners = {};
  const read = () => readJson(key) || {};
  chan.onmessage = e => listeners[e.data.coll]?.(e.data.docs, false);
  return {
    listen(coll, onDocs) {
      listeners[coll] = onDocs;
      setTimeout(() => onDocs(Object.entries(read()[coll] || {}).map(([id, data]) => ({ id, data, local: false })), false), 30);
      return () => { delete listeners[coll]; };
    },
    async get(coll, id) { return read()[coll]?.[id]?.j; },
    async commit(writes) {
      const all = read(), out = {};
      for (const w of writes) {
        (all[w.coll] ||= {})[w.id] = w.data;
        (out[w.coll] ||= []).push({ id: w.id, data: w.data, local: false });
      }
      store.set(key, JSON.stringify(all));
      for (const [coll, docs] of Object.entries(out)) chan.postMessage({ coll, docs });
    },
  };
}

async function startSync(room) {
  sync.room = room;
  Object.assign(sync, { on: true, ready: false, failed: false, denied: false, loaded: new Set(), softOk: new Set(), softDenied: new Set(), unsubs: [] });
  renderTeamButton(); renderStatus();
  try { sync.backend = DEV_SYNC ? devBackend(room) : await firestoreBackend(room); }
  catch (e) {
    console.error(e);
    Object.assign(sync, { on: false, failed: true });
    renderTeamButton(); renderStatus();
    toast('Could not reach the team database. Your notes still save on this device.');
    return;
  }
  if (!sync.on) return; // stopped while the database was loading
  for (const coll of [...SYNC_COLLS, 'meta']) {
    sync.unsubs.push(sync.backend.listen(coll, (docs, fromCache) => applyRemote(coll, docs, fromCache), err => { console.error(err); sync.failed = true; sync.denied = err?.code === 'permission-denied'; renderStatus(); if (sync.denied && !DEV_SYNC) lostAccess(); }));
  }
  for (const coll of SOFT_COLLS) {
    sync.unsubs.push(sync.backend.listen(coll, (docs, fromCache) => applyRemote(coll, docs, fromCache), err => { console.warn(`Not syncing "${coll}" yet: the database rules need updating.`, err?.code || err); sync.softDenied.add(coll); if (ui.view !== 'film' && !hubBusy()) renderHub(); }));
  }
}
// The organiser took this account off the list, or the room is gone.
function lostAccess() {
  if (!sync.on) return;
  stopSync();
  team.unsub.forEach(f => f()); team.unsub = [];
  gate('noaccess', { error: 'You no longer have access to that team room.' });
}
function stopSync() {
  (sync.unsubs || []).forEach(f => f?.());
  Object.assign(sync, { on: false, ready: false, unsubs: [] });
  renderTeamButton(); renderStatus();
}

function applyRemote(coll, docs, fromCache) {
  let changed = false;
  for (const { id, data, local } of docs) {
    if (local || !data || typeof data.j !== 'string' || sync.synced[coll][id] === data.j) continue;
    let obj;
    try { obj = JSON.parse(data.j); } catch { continue; }
    if (coll === 'meta' && id.startsWith('act-')) { sync.synced.meta[id] = data.j; actRemote(id.slice(4), obj); continue; }
    const into = coll === 'meta' && id.startsWith('x-') ? 'x' : coll; // extras travel in the meta collection
    if (into === 'meta') {
      if ((obj.divisionAt || 0) > (db.divisionAt || 0)) { db.division = obj.division; db.divisionAt = obj.divisionAt; }
      db.customTags = [...new Set([...(db.customTags || []), ...(obj.customTags || [])])];
    } else {
      const cur = db[into][id];
      if (cur && (cur.updatedAt || 0) > (obj.updatedAt || 0)) continue; // ours is newer and gets pushed
      if (cur) { for (const k of Object.keys(cur)) delete cur[k]; Object.assign(cur, obj); } // in place, so open dialogs keep working
      else db[into][id] = obj;
      if (into === 'x') cmCache = null;
    }
    sync.synced[coll][id] = data.j;
    changed = true;
  }
  if (changed) { store.set(KEY, JSON.stringify(db)); scheduleRefresh(); }
  if (!fromCache && !sync.loaded.has(coll)) {
    sync.loaded.add(coll);
    if (SOFT_COLLS.includes(coll)) { sync.softOk.add(coll); if (sync.ready) pushChanges(); }
    else if (!sync.ready && [...SYNC_COLLS, 'meta'].every(c => sync.loaded.has(c))) { sync.ready = true; pushChanges(); renderStatus(); actHello(); }
  }
}

function pushChanges() {
  if (!sync.on || !sync.ready || !sync.backend) return;
  const writes = [];
  for (const coll of [...SYNC_COLLS, ...SOFT_COLLS.filter(c => sync.softOk.has(c))]) {
    for (const [id, obj] of Object.entries(db[coll])) {
      const j = JSON.stringify(obj);
      if (sync.synced[coll][id] !== j) writes.push({ coll, id, j });
    }
  }
  for (const [id, obj] of Object.entries(db.x)) {
    const j = JSON.stringify(obj);
    if (id.startsWith('x-') && sync.synced.meta[id] !== j) writes.push({ coll: 'meta', id, j });
  }
  const meta = JSON.stringify({ division: db.division, divisionAt: db.divisionAt || 0, customTags: db.customTags || [] });
  if (sync.synced.meta.settings !== meta) writes.push({ coll: 'meta', id: 'settings', j: meta });
  if (!writes.length) { renderStatus(); return; }
  writes.forEach(w => { sync.synced[w.coll][w.id] = w.j; });
  sync.inflight++;
  renderStatus();
  sync.backend.commit(writes.map(w => ({ coll: w.coll, id: w.id, data: { j: w.j, at: Date.now(), by: me || '' } })))
    .then(() => { sync.failed = false; })
    .catch(e => {
      console.error(e);
      sync.failed = true;
      writes.forEach(w => { if (sync.synced[w.coll][w.id] === w.j) delete sync.synced[w.coll][w.id]; }); // retried on the next save
    })
    .finally(() => { sync.inflight--; renderStatus(); });
}

/* ================= team activity: what each person watched and opened =================
   Every person keeps one small record of what they have watched and opened. It is saved on the device and shared
   with the team as one document in the "meta" collection ("act-<person>"), which the database rules already allow.
   Clips, notes and plays already carry their author, so what people added needs no extra bookkeeping. */
const KEY_ACT = ns('filmroom.act'), KEY_DEV = ns('filmroom.dev');
const ACT_BUCKET = 10; // the video is counted in ten-second pieces

// pid: the roster player this person is · d: assignments they marked done (a minus sign means un-marked)
const freshAct = () => ({ v: 1, name: '', names: [], eh: '', pid: '', at: 0, days: [], w: {}, g: {}, c: {}, h: {}, p: {}, d: {} });
const dayKey = (ts = Date.now()) => { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
// Watched pieces of a game, kept as sorted [first, last] runs of piece numbers.
const runsHave = (r, i) => r.some(([a, b]) => i >= a && i <= b);
const runsCount = r => r.reduce((n, [a, b]) => n + b - a + 1, 0);
function runsUnion(a, b) {
  const all = [...a, ...b].map(x => [x[0], x[1]]).sort((x, y) => x[0] - y[0]), out = [];
  for (const x of all) {
    const last = out[out.length - 1];
    if (last && x[0] <= last[1] + 1) last[1] = Math.max(last[1], x[1]); else out.push(x);
  }
  return out;
}
// Records come from teammates' devices, so read them defensively.
function cleanAct(o) {
  const out = freshAct(), num = x => (Number.isFinite(+x) ? +x : 0), obj = m => (m && typeof m === 'object' ? m : {});
  const map = m => Object.fromEntries(Object.entries(obj(m)).map(([k, v]) => [k, num(v)]));
  out.name = String(o?.name || '').slice(0, 60);
  out.names = (Array.isArray(o?.names) ? o.names : []).map(norm).filter(Boolean).slice(0, 12);
  out.eh = String(o?.eh || '').slice(0, 32);
  out.pid = String(o?.pid || '').slice(0, 60);
  out.d = map(o?.d);
  out.at = num(o?.at);
  out.days = (Array.isArray(o?.days) ? o.days : []).filter(d => /^\d{4}-\d\d-\d\d$/.test(d)).sort().slice(-ACT_DAYS);
  out.w = map(o?.w); out.c = map(o?.c); out.h = map(o?.h); out.p = map(o?.p);
  for (const [id, g] of Object.entries(obj(o?.g))) {
    const r = (Array.isArray(g?.r) ? g.r : []).filter(x => Array.isArray(x) && x[0] >= 0 && x[1] >= x[0]).map(x => [Math.floor(x[0]), Math.floor(x[1])]);
    out.g[id] = { r: runsUnion(r, []), at: num(g?.at), dur: num(g?.dur) };
  }
  return out;
}
// Fold one record into another (the same person on a second device). Says whether the target gained anything.
function mergeAct(t, s) {
  const before = JSON.stringify(t);
  if (s.pid && (s.at > t.at || !t.pid)) t.pid = s.pid;
  for (const [id, v] of Object.entries(s.d)) if (!(Math.abs(t.d[id] || 0) >= Math.abs(v))) t.d[id] = v;
  if (s.at > t.at) { t.name = s.name || t.name; t.at = s.at; }
  t.names = [...new Set([...t.names, ...s.names])].slice(0, 12);
  t.eh ||= s.eh;
  t.days = [...new Set([...t.days, ...s.days])].sort().slice(-ACT_DAYS);
  for (const k of ['w', 'c', 'h', 'p']) for (const [id, v] of Object.entries(s[k])) if (!(t[k][id] >= v)) t[k][id] = v;
  for (const [id, g] of Object.entries(s.g)) {
    const m = (t.g[id] ||= { r: [], at: 0, dur: 0 });
    m.r = runsUnion(m.r, g.r); m.at = Math.max(m.at, g.at); m.dur = g.dur || m.dur;
  }
  return JSON.stringify(t) !== before;
}
const actLog = {
  mine: cleanAct(readJson(KEY_ACT)), // this person's own record
  all: {},                            // everyone's records by key, from the team database
  dirty: false, lastPush: 0, timer: 0, saveTimer: 0, refresh: 0, carry: 0,
  partial: {}, watch: { gameId: null, t: 0, wall: 0 }, hashes: {},
};
// One record per signed-in person, whatever device they use. Without sign-in (test mode), one per device.
function actKey() {
  if (team.user?.uid) return `u${team.user.uid}`;
  let d = store.get(KEY_DEV);
  if (!d) { d = uid('dev').slice(4); store.set(KEY_DEV, d); }
  return `d${d}`;
}
const sha16 = async text => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)))].slice(0, 8).map(b => b.toString(16).padStart(2, '0')).join('');
function actIdentity() {
  const m = actLog.mine, name = me || team.user?.displayName || '';
  m.name = name;
  for (const n of [me, name]) { const k = norm(n); if (k && !m.names.includes(k)) m.names = [...m.names, k].slice(-12); }
}
function actTouch() {
  const m = actLog.mine, day = dayKey();
  m.at = Date.now();
  if (!m.days.includes(day)) m.days = [...m.days, day].sort().slice(-ACT_DAYS);
  actLog.dirty = true;
  if (!actLog.saveTimer) actLog.saveTimer = setTimeout(() => { actLog.saveTimer = 0; store.set(KEY_ACT, JSON.stringify(actLog.mine)); }, 2000);
  actPushSoon();
}
// kind: c = a clip watched to its end, h = a Coaching hub page opened, p = a play opened
function actMark(kind, id) { if (!id) return; actLog.mine[kind][id] = Date.now(); actTouch(); }
// Called ten times a second while the video plays. A ten-second piece counts once half of it has been played,
// so dragging along the timeline does not count as watching.
function actWatch(gameId, t, dur) {
  const w = actLog.watch, now = performance.now(), dt = t - w.t;
  const steady = w.gameId === gameId && dt > 0 && dt < 1.5 && now - w.wall < 2000;
  w.gameId = gameId; w.t = t; w.wall = now;
  if (!steady) return;
  const m = actLog.mine, i = Math.floor(t / ACT_BUCKET), k = `${gameId}:${i}`;
  let changed = false;
  actLog.carry += dt;
  if (actLog.carry >= 5) { const day = dayKey(); m.w[day] = (m.w[day] || 0) + 5; actLog.carry -= 5; changed = true; }
  const got = actLog.partial[k] = (actLog.partial[k] || 0) + dt;
  if (got >= ACT_BUCKET / 2) {
    const g = (m.g[gameId] ||= { r: [], at: 0, dur: 0 });
    if (dur) g.dur = Math.round(dur);
    if (!runsHave(g.r, i)) { g.r = runsUnion(g.r, [[i, i]]); changed = true; }
    if (changed) g.at = Date.now();
  }
  if (changed) actTouch();
}
// Share the record with the team: soon after the first change, then at most once a minute.
function actPushSoon(wait) {
  if (actLog.timer) return;
  actLog.timer = setTimeout(() => { actLog.timer = 0; actPush(); }, wait ?? Math.max(4000, 60000 - (Date.now() - actLog.lastPush)));
}
function actPush() {
  clearTimeout(actLog.timer); actLog.timer = 0;
  if (!actLog.dirty) return;
  const m = actLog.mine;
  actIdentity();
  for (const old of Object.keys(m.w).sort().slice(0, -ACT_DAYS)) delete m.w[old];
  const seen = Object.entries(m.c);
  if (seen.length > 4000) m.c = Object.fromEntries(seen.sort((a, b) => b[1] - a[1]).slice(0, 3000));
  const j = JSON.stringify(m);
  store.set(KEY_ACT, j);
  if (!sync.on || !sync.ready || !sync.backend) return; // stays on this device until the team room is connected
  const id = `act-${actKey()}`;
  actLog.dirty = false; actLog.lastPush = Date.now();
  sync.synced.meta[id] = j;
  sync.backend.commit([{ coll: 'meta', id, data: { j, at: Date.now(), by: me || '' } }]).catch(e => { console.error(e); actLog.dirty = true; });
}
// The team room has just connected: note that this person was here today.
async function actHello() {
  const email = emailOf(team.user);
  if (email && !actLog.mine.eh) { try { actLog.mine.eh = await sha16(email); } catch { /* the page still works without it */ } }
  actTouch();
  actRefreshSoon();
}
// A record arrived from the team database.
function actRemote(key, raw) {
  if (!raw || raw.v !== 1) return;
  const rec = cleanAct(raw);
  actLog.all[key] = rec;
  if (key === actKey()) { // this person's own record, written by another of their devices
    if (mergeAct(actLog.mine, rec)) store.set(KEY_ACT, JSON.stringify(actLog.mine));
    if (mergeAct(cleanAct(rec), actLog.mine)) { actLog.dirty = true; actPushSoon(); } // the shared copy lacks something from here
  }
  actRefreshSoon();
}
function actRefreshSoon() {
  clearTimeout(actLog.refresh);
  actLog.refresh = setTimeout(() => { if (ui.view === 'team' && !hubTyping()) renderHub(); }, 300);
}
addEventListener('pagehide', () => actPush());
document.addEventListener('visibilitychange', () => { if (document.hidden) actPush(); });

/* ================= shared extras: assignments, comments, game plans, practices, lines =================
   Each of these is a small document of its own in db.x. They sync as "x-…" documents in the "meta" collection,
   which the database rules already allow, so nothing has to be published for the team to share them.
   kind: as = assignment · cm = comment on a clip · gp = game plan · pp = practice · ln = line */
let cmCache = null;

const xGet = id => { const o = db.x[id]; return o && !o.deleted ? o : null; };
function xPut(o) { db.x[o.id] = touch(o); cmCache = null; save(); return o; }
const xNew = (kind, data) => xPut({ id: uid(`x-${kind}`), kind, author: me || '', createdAt: Date.now(), ...data });
function xDel(id) { const o = db.x[id]; if (o) { o.deleted = true; xPut(o); } }

const niceDay = d => new Date(`${d}T12:00`).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });

const myNames = () => new Set([norm(me), ...actLog.mine.names].filter(Boolean));
// The roster player this person said they are ("This is me").
const myPlayer = () => { const p = db.players[actLog.mine.pid]; return p && !p.deleted && isUs(p.teamId) ? p : null; };
// After a change to something that can show in the film panel or on a hub page.

}

// Comments by other people on clips this person tagged, is tagged in, or has commented on.
function cmForMe(since) {
  const mine = myNames(), pid = actLog.mine.pid;

      && (mine.has(norm(clip.author)) || (pid && (clip.playerIds || []).includes(pid)) || cmOf(c.clipId).some(x => mine.has(norm(x.author))));

function newsReplies(since) {

  }).join('')}</ul><span class="eyebrow">New clips</span>`;

/* ---------- assignments ---------- */
// How far one person is with an assignment. rec is their watch record (or null), names their name and aliases.
function asProgress(a, rec, names, people) {
  const games = (a.gameIds || []).map(gameLive).filter(Boolean);
  let sum = 0;
  for (const g of games) {
    if (a.mode === 'clips') {
      const cl = clipsOfGame(g.id).filter(c => !names.has(norm(c.author)));
      sum += cl.length ? cl.filter(c => rec && rec.c[c.id]).length / cl.length : 1;
    } else {
      const w = rec && rec.g[g.id], dur = avGameDur(g.id, people);
      sum += w && dur ? Math.min(1, runsCount(w.r) * ACT_BUCKET / dur) : 0;
    }
  }
  const pct = games.length ? Math.round(sum / games.length * 100) : 0;
  const manual = !!rec && rec.d[a.id] > 0;
  return { pct, manual, done: manual || (games.length > 0 && pct >= (a.mode === 'clips' ? 100 : 90)) };
}
const asMine = a => { const mine = myNames(); return !(a.who || []).length || a.who.some(n => mine.has(n)); };
const asSort = (a, b) => (a.due || '9999').localeCompare(b.due || '9999') || newestFirst(a, b);
function asDue(a) {
  if (!a.due) return { text: 'No date', cls: '' };
  const today = dayKey();
  if (a.due < today) return { text: `Was due ${niceDay(a.due)}`, cls: 'late' };
  return a.due === today ? { text: 'Due today', cls: 'soon' } : { text: `Due ${niceDay(a.due)}`, cls: '' };
}
function asDialog(a) {

  openDialog(`<h2>${a ? 'Edit assignment' : 'New assignment'}</h2>
    <label class="field"><span class="eyebrow">Title</span><input name="title" required maxlength="80" value="${esc(a?.title || '')}" placeholder="e.g. Watch the semi-final before Thursday"></label>
    <div class="field"><span class="eyebrow">Games</span><div class="x-checks">${games.map(g => `<label><input type="checkbox" name="g" value="${g.id}"${gset.has(g.id) ? ' checked' : ''}> ${esc(g.title)}</label>`).join('')}</div></div>
    <div class="row2 even"><label class="field"><span class="eyebrow">What to watch</span><select name="mode"><option value="full">The whole game</option><option value="clips"${a?.mode === 'clips' ? ' selected' : ''}>Only the tagged clips</option></select></label>
      <label class="field"><span class="eyebrow">Due</span><input type="date" name="due" value="${esc(a?.due || '')}"></label></div>
    <div class="field"><span class="eyebrow">Who</span><div class="x-checks"><label><input type="checkbox" name="all"${who.size ? '' : ' checked'}> Everyone on the team</label>
      ${people.map(p => { const n = [...p.names][0]; return `<label><input type="checkbox" name="w" value="${esc(n)}"${[...p.names].some(x => who.has(x)) ? ' checked' : ''}> ${esc(p.name)}</label>`; }).join('')}</div>
      <p class="hint">Untick Everyone to pick people. Only people who have opened Film Room are listed.</p></div>
    <label class="field"><span class="eyebrow">Note</span><textarea name="note" rows="2" maxlength="400" placeholder="What to look for">${esc(a?.note || '')}</textarea></label>
    <div class="dlg-actions">${a ? '<button class="btn ghost danger" value="delete" formnovalidate>Delete</button>' : ''}<span class="spacer"></span><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="save">Save</button></div>`,
  (form, v) => {

function renderStatus() {
  let cls = '', msg = localSaveOk ? 'Saved on this device' : 'Not saved here. Export your notes.';
  if (sync.on) {
    if (sync.failed) { cls = 'error'; msg = sync.denied ? 'No access to this team room. Saved on this device.' : 'Team sync problem. Saved on this device.'; }
    else if (!sync.ready) { cls = 'saving'; msg = 'Connecting to team…'; }
    else if (!navigator.onLine) { cls = 'saving'; msg = 'Offline. Changes will sync.'; }
    else if (sync.inflight) { cls = 'saving'; msg = 'Saving to team…'; }
    else { cls = 'live'; msg = 'Live. Saved to team'; }

  $('#status').className = `status ${cls}`;

}

/* ================= what's new ================= */
const seenAt = () => +(store.get(KEY_SEEN) || 0);
const byOthers = c => !me || norm(c.author) !== norm(me);
function renderNewsBadge() {
  const since = seenAt();

function timeAgo(ts) {
  const s = Math.max(0, (Date.now() - ts) / 1000);

  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;

}

/* ================= text exports ================= */
function groupByTag(clips) {
  const groups = new Map();
  for (const c of clips) {
    const tags = (c.tags || []).length ? c.tags : ['Untagged'];
    for (const t of tags) { if (!groups.has(t)) groups.set(t, []); groups.get(t).push(c); }
  }
  return [...groups.entries()].sort((a, b) => (a[0] === 'Untagged') - (b[0] === 'Untagged') || b[1].length - a[1].length);
}
function clipLine(c, { withSide = false } = {}) {
  const g = db.games[c.gameId];
  const bits = [];
  if (withSide) bits.push(`[${sideName(c.side, c.teamId)}${verdictOf(c) ? ', ' + VERDICT[verdictOf(c)].toLowerCase() : ''}]`);
  if (c.note) bits.push(c.note);
  else if ((c.tags || []).length) bits.push(c.tags.join(', '));
  const players = playersOfClip(c);
  if (players.length && withSide === false) bits.push(`(${players.map(playerLabel).join(', ')})`);
  if (c.priority === 3) bits.push('MUST WATCH');
  return `  - ${fmt(c.start)} ${ytLink(g.videoId, c.start)}  ${bits.join(' · ')}${c.author ? ` (${c.author})` : ''}`;
}
function reportText(t) {
  const clips = clipsOfTeam(t.id).sort(byGameThenStart);
  const kind = kindOf(t.id), lib = kind === 'library', us = kind === 'us';
  let out = `${lib ? 'TACTICS TO LEARN' : us ? 'SELF-SCOUT' : 'SCOUTING REPORT'}: ${t.name.toUpperCase()}\n${db.division}\n`;
  if ((t.notes || '').trim()) out += `\n${lib ? 'WHAT WE WANT TO TAKE FROM THIS' : us ? 'WHAT WE ARE WORKING ON' : 'GAME PLAN'}\n${t.notes.trim()}\n`;
  const linked = (t.playIds || []).map(playOf).filter(Boolean);
  if (linked.length) out += `\n${us ? 'OUR PLAYS' : 'PLAYS FOR THIS GAME'}\n${linked.map(p => `  - ${p.name}${p.summary ? ': ' + p.summary : ''}`).join('\n')}\n`;
  const notes = notesOf(t.id);
  if (notes.length) out += `\nNOTES\n${notes.map(n => `  - ${n.text}${n.author ? ` (${n.voiceFrom ? `voice note from ${n.voiceFrom}, ` : ''}${n.author}, ${noteDate(n.createdAt)})` : ''}`).join('\n')}\n`;
  const side = s => c => c.side === s;
  const sections = lib ? [['OFFENCE IDEAS', side('O')], ['DEFENCE IDEAS', side('D')], ['SKILLS', side('P')]]
    : us ? [['TO FIX', c => verdictOf(c) === 'fix'], ['WHAT IS WORKING', c => verdictOf(c) === 'good']]
    : [['THEIR OFFENCE', side('O')], ['THEIR DEFENCE', side('D')]];
  for (const [title, keep] of sections) {
    const cs = clips.filter(keep);
    if (!cs.length) continue;
    out += `\n${title}\n`;
    for (const [tag, list] of groupByTag(cs)) out += `${tag} (${list.length})\n${list.map(c => clipLine(c)).join('\n')}\n`;
  }
  const roster = lib ? [] : rosterOf(t.id);
  if (roster.length) {
    out += `\n${us ? 'PLAYER FEEDBACK' : 'KEY PLAYERS'}\n`;
    for (const p of sortPlayers(roster, clips)) {
      const cs = clips.filter(c => (c.playerIds || []).includes(p.id));
      out += `${playerLabel(p)}${p.role ? ' · ' + p.role : ''}${p.threat ? ' · threat ' + THREAT[p.threat].toLowerCase() : ''}\n`;
      if (p.notes) out += `  ${p.notes}\n`;
      if (cs.length) out += cs.map(c => clipLine(c, { withSide: true })).join('\n') + '\n';
    }
  }
  const games = gamesOf(t.id);
  if (games.length) out += `\n${lib ? 'VIDEOS' : 'GAMES'}\n${games.map(g => `  - ${g.title}: https://youtu.be/${g.videoId}`).join('\n')}\n`;
  return out;
}
function sortPlayers(roster, clips) {
  const n = id => clips.filter(c => (c.playerIds || []).includes(id)).length;
  return [...roster].sort((a, b) => (b.threat || 0) - (a.threat || 0) || n(b.id) - n(a.id));
}
function reelText() {
  const q = reelMatches();

}

/* ---- voice notes ----
   Whisper runs in the browser (transformers.js), in a worker so the page stays responsive. Speech is turned
   into text on this device: nothing is sent anywhere except the one-time model downloads, which the browser
   keeps. Afrikaans becomes English: the big model writes the Afrikaans, then a small translation model
   turns it into English. The smaller models translate straight to English, since they write Afrikaans as Dutch. */
const VOICE_MODELS = {
  quick: { model: 'onnx-community/whisper-base', dtype: 'q8' },
  accurate: { model: 'onnx-community/whisper-small', dtype: 'q8' },
  best: { model: 'onnx-community/whisper-large-v3-turbo', device: 'webgpu' },
};
let voiceWorker = null;
function voiceWorkerUrl() {
  const src = `import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';
// Keep downloaded models in the browser's file storage. The normal cache refuses single files over about
// 250 MB, which would mean downloading the big model again for every voice note.
const keyOf = req => String(typeof req === 'string' ? req : req.url).replace(/[^a-z0-9._-]+/gi, '_').slice(-180);
const modelDir = () => navigator.storage.getDirectory().then(root => root.getDirectoryHandle('models', { create: true }));
env.useBrowserCache = false;
env.useCustomCache = true;
env.customCache = {
  async match(req) {
    try {
      const file = await (await (await modelDir()).getFileHandle(keyOf(req))).getFile();
      if (file.size) return new Response(file, { headers: { 'content-length': String(file.size) } });
    } catch {}
    try { return await (await caches.open('transformers-cache')).match(req); } catch {}
  },
  async put(req, res) {
    try {
      const w = await (await (await modelDir()).getFileHandle(keyOf(req), { create: true })).createWritable();
      await res.body.pipeTo(w);
    } catch { try { await (await caches.open('transformers-cache')).put(req, res); } catch {} }
  },
};
const pipes = {};
async function load(key, task, model, opts) {
  pipes[key] ||= pipeline(task, model, opts);
  try { return await pipes[key]; } catch (e) { pipes[key] = null; throw e; }
}
self.onmessage = async e => {
  const { model, device, dtype, audio, language, translate } = e.data;
  const files = {};
  const progress_callback = p => {
    if (p.status !== 'progress' || !p.total) return;
    files[p.file] = [p.loaded, p.total];
    const all = Object.values(files);
    self.postMessage({ type: 'load', loaded: all.reduce((a, f) => a + f[0], 0), total: all.reduce((a, f) => a + f[1], 0) });
  };
  try {
    const asr = await load(model + (device || ''), 'automatic-speech-recognition', model, { dtype, ...(device ? { device } : {}), progress_callback });
    self.postMessage({ type: 'run' });
    const out = await asr(audio, { chunk_length_s: 30, stride_length_s: 5, language, task: translate === 'whisper' ? 'translate' : 'transcribe' });
    let text = String(out.text || '').trim(), original = '';
    if (translate === 'mt' && text) {
      const mt = await load('mt', 'translation', 'Xenova/opus-mt-af-en', { dtype: 'q8', progress_callback });
      self.postMessage({ type: 'translate' });
      original = text;
      const sentences = (text.match(/[^.!?]+[.!?]*/g) || [text]).map(s => s.trim()).filter(Boolean);
      const done = [];
      for (const s of sentences) done.push((await mt(s))[0].translation_text);
      text = done.join(' ');
    }
    self.postMessage({ type: 'done', text, original });
  } catch (err) {
    self.postMessage({ type: 'error', message: String(err && err.message || err) });
  }
};`;

}
// Whisper wants 16 kHz mono. The browser decodes the file (WhatsApp .opus, .m4a, .mp3…) and resamples it.
async function decodeVoice(file) {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  const ctx = new Ctx({ sampleRate: 16000 });
  try {
    const buf = await ctx.decodeAudioData(await file.arrayBuffer());
    const out = new Float32Array(buf.length);
    for (let c = 0; c < buf.numberOfChannels; c++) { const ch = buf.getChannelData(c); for (let i = 0; i < ch.length; i++) out[i] += ch[i] / buf.numberOfChannels; }

  } finally { ctx.close?.(); }
}
async function transcribeInto(form, file) {

  const say = (msg, frac) => { status.textContent = msg; bar.hidden = frac == null; if (frac != null) { if (frac < 0) bar.removeAttribute('value'); else bar.value = frac; } };
  const language = form.lang.value, choice = form.model.value, afr = language === 'afrikaans';

    if (!res.text) { say('No speech found in that voice note.'); return; }
    const ta = form.text;
    ta.value = ta.value.trim() ? `${ta.value.trim()}\n\n${res.text}` : res.text;
    if (res.original) { form.original.value = res.original; $('[data-orig]', form).hidden = false; }
    $('[data-from]', form).hidden = false;
    form._voice = { file, secs };
    say(afr ? 'Done. Check the English, fix any names it got wrong, and add who sent it.' : 'Done. Check the text, fix any names it got wrong, and add who sent it.');
    form.from.focus();
  } catch (e) {
    console.error(e);
    say(`${e.message || e}`);
    if (voiceWorker) { voiceWorker.terminate(); voiceWorker = null; }
  } finally {
    pick.classList.remove('busy'); form.audio.disabled = false;
  }
}

// The audio goes to the team room in pieces (each database entry holds under 1 MB), separate from the notes,
// and is only fetched when someone presses Listen.
const VOICE_PART = 400000, VOICE_MAX = 4e6;
const bytesToB64 = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(s); };
async function keepVoice(note, { file, secs }) {
  if (!sync.on || !sync.backend) { toast('Note saved. The audio is only kept in a team room.'); return; }
  if (file.size > VOICE_MAX) { toast('Note saved. That voice note is too long to keep the audio (over 4 MB).'); return; }
  try {
    const b64 = bytesToB64(new Uint8Array(await file.arrayBuffer()));
    const parts = Math.ceil(b64.length / VOICE_PART), at = Date.now();
    await sync.backend.commit(Array.from({ length: parts }, (_, i) => ({ coll: 'voice', id: `${note.id}-${i}`, data: { j: b64.slice(i * VOICE_PART, (i + 1) * VOICE_PART), at, by: me || '' } })));
    note.voice = { parts, type: file.type || 'audio/ogg', secs: Math.round(secs) };
    touch(note); save(); renderNotes();
  } catch (e) { console.error(e); toast('Note saved, but the audio did not upload. Check your connection.'); }
}
const voiceUrls = {};
async function playVoice(note, btn) {
  const slot = btn.closest('.note')?.querySelector('.voice-slot');
  if (!slot) return;
  btn.disabled = true;
  try {
    if (!voiceUrls[note.id]) {
      const parts = await Promise.all(Array.from({ length: note.voice.parts }, (_, i) => sync.backend.get('voice', `${note.id}-${i}`)));
      if (parts.some(p => typeof p !== 'string')) throw new Error('missing');
      const bin = atob(parts.join('')), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      voiceUrls[note.id] = URL.createObjectURL(new Blob([bytes], { type: note.voice.type }));
    }
    slot.innerHTML = `<audio controls autoplay src="${voiceUrls[note.id]}"></audio>`;
    btn.hidden = true;
  } catch (e) { console.error(e); toast(sync.on ? 'Could not load that voice note.' : 'Voice notes play once you are in the team room.'); btn.disabled = false; }
}

function renderTimeline() {

function profileText(p) {
  const t = db.teams[p.teamId], us = isUs(p.teamId), all = playerClips(p);
  let out = `PLAYER PROFILE: ${playerLabel(p).toUpperCase()} (${t?.name || ''})\n`;
  const meta = [p.role, HANDS[p.hand], p.threat && !us ? `${THREAT[p.threat]} threat` : ''].filter(Boolean).join(' · ');
  if (meta) out += `${meta}\n`;
  if ((p.tendencies || []).length) out += `\nTendencies: ${p.tendencies.join(', ')}\n`;
  if (p.strengths) out += `\nStrengths\n${p.strengths}\n`;
  if (p.weaknesses) out += `\nWeaknesses\n${p.weaknesses}\n`;
  if (p.notes) out += `\n${us ? 'What to work on' : 'How we stop them'}\n${p.notes}\n`;
  if (all.length) out += `\nCLIPS (${all.length})\n${all.map(c => clipLine(c, { withSide: true })).join('\n')}\n`;
  return out;
}

function openDialog(html, onSubmit, onMount, wide) {
  const dlg = $('#dlg');
  if (dlg.open) dlg.close();
  delete dlg.dataset.kind;
  dlg.className = wide ? 'wide' : '';
  dlg.innerHTML = `<form method="dialog" class="dlg-form">${html}</form>`;
  const form = $('form', dlg);
  form.addEventListener('submit', e => {
    const v = e.submitter?.value;
    if (v === 'cancel') return;
    e.preventDefault();
    if (onSubmit(form, v) !== false) dlg.close();
  });
  dlg.showModal();
  onMount?.(form);
}
function armDanger(btn, label) {
  if (btn.classList.contains('armed')) return true;
  btn.classList.add('armed'); btn.textContent = label;
  return false;
}

function gameDialog(game) {
  const isNew = !game, sel = game ? game.teamIds : [ui.teamId];
  const nClips = game ? clipsOfGame(game.id).length : 0;
  openDialog(`
    <h2>${isNew ? (isLib(ui.teamId) ? 'Add a video' : 'Add a game') : 'Edit game'}</h2>
    <label class="field"><span class="eyebrow">YouTube link</span><input name="url"${isNew ? ' required' : ''} value="${game && game.videoId ? 'https://youtu.be/' + esc(game.videoId) : ''}" placeholder="https://www.youtube.com/watch?v=..."${isNew || !game.videoId ? '' : ' readonly'}></label>
    <label class="field"><span class="eyebrow">Title</span><input name="title" value="${esc(game && !game.autoTitle ? game.title : '')}" placeholder="Blank uses the YouTube title" maxlength="120"></label>
    <fieldset class="field"><legend class="eyebrow">Teams in this game</legend><div class="checks">${[...ourTeams(), ...opponents()].map(t => `<label class="check"><input type="checkbox" name="teams" value="${t.id}"${sel.includes(t.id) ? ' checked' : ''}> ${esc(t.name)}</label>`).join('')}</div></fieldset>
    <fieldset class="field"><legend class="eyebrow">Or file it under tactics to learn</legend><div class="checks">${libraries().map(t => `<label class="check"><input type="checkbox" name="teams" value="${t.id}"${sel.includes(t.id) ? ' checked' : ''}> ${esc(t.name)}</label>`).join('') || '<span class="hint">No collections yet.</span>'}</div></fieldset>
    <label class="field"><span class="eyebrow">Who is breaking this one down</span><input name="assignee" value="${esc(game?.assignee || '')}" placeholder="e.g. Sam and Priya" maxlength="60"></label>
    <p class="err" hidden></p>
    <div class="dlg-actions">${isNew ? '' : '<button class="btn ghost danger" value="delete" formnovalidate>Delete game</button>'}<span class="spacer"></span><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="save">${isNew ? 'Add game' : 'Save'}</button></div>`,
  (form, v) => {
    const err = $('.err', form);
    if (v === 'delete') {
      const btn = $('[value="delete"]', form);
      if (!armDanger(btn, nClips ? `Delete game and its ${nClips} clips?` : 'Click again to delete')) return false;
      game.deleted = true; touch(game);
      clipsOfGame(game.id).forEach(c => { c.deleted = true; touch(c); });
      if (ui.draft?.gameId === game.id) ui.draft = null;
      save();
      if (ui.gameId === game.id) { ui.gameId = null; ui.loadedGameId = null; if (ready()) player.pauseVideo(); }
      fixSelection(); if (ui.gameId) selectGame(ui.gameId); else renderAll();
      toast('Game deleted.');
      return true;
    }
    const teamIds = $$('input[name="teams"]:checked', form).map(i => i.value);
    if (!teamIds.length) { err.textContent = 'Pick at least one team or collection.'; err.hidden = false; return false; }
    const title = form.title.value.trim(), assignee = form.assignee.value.trim();
    if (isNew) {
      const msg = addGame({ url: form.url.value, title, teamIds, assignee });
      if (msg) { err.textContent = msg; err.hidden = false; return false; }
    } else {
      if (!game.videoId && form.url.value.trim()) { // a game that came in without film gets its video now
        const vid = parseYouTubeId(form.url.value);
        if (!vid) { err.textContent = 'That does not look like a YouTube video link.'; err.hidden = false; return false; }
        game.videoId = vid;
        if (ui.loadedGameId === game.id) ui.loadedGameId = null; // so the video loads
      }
      Object.assign(game, { teamIds, assignee });
      if (title) { game.title = title; game.autoTitle = false; }
      touch(game); save();
      if (!teamIds.includes(ui.teamId)) ui.teamId = teamIds[0];
      if (ui.gameId === game.id && ui.loadedGameId !== game.id) selectGame(game.id); else renderAll();
    }
    return true;
  });
}
function addGame({ url, title, teamIds, assignee }) {
  const videoId = parseYouTubeId(url);
  if (!videoId) return 'That does not look like a YouTube video link.';
  const existing = live('games').find(g => g.videoId === videoId);
  if (existing) {
    existing.teamIds = [...new Set([...existing.teamIds, ...teamIds])];
    touch(existing); save();
    ui.teamId = teamIds[0];
    selectGame(existing.id);
    toast('That game was already here, so it is now linked to this team too.');
    return null;
  }
  const g = touch({ id: uid('game'), videoId, title: title || 'Untitled game', autoTitle: !title, teamIds, assignee: assignee || '', createdAt: Date.now() });
  db.games[g.id] = g;
  save();
  if (!teamIds.includes(ui.teamId)) ui.teamId = teamIds[0];
  selectGame(g.id);
  return null;
}

/* ================= selection ================= */
function selectArea(kind) {
  const last = ui.lastByArea[kind];
  const target = last && db.teams[last] && !db.teams[last].deleted && kindOf(last) === kind ? last : teamsOfKind(kind)[0]?.id;
  if (target) selectTeam(target);
  else teamDialog(null, kind);
}
function selectTeam(id) {
  ui.teamId = id;
  const g = gameLive(ui.gameId);
  if (!g || !g.teamIds.includes(id)) {
    const first = gamesOf(id)[0];
    if (first) { selectGame(first.id); return; }
    ui.gameId = null;
    if (!ui.reel.active) { ui.loadedGameId = null; ui.playClip = null; if (ready()) player.pauseVideo(); }
  }
  saveUi(); renderAll();
}
function selectGame(id, { start, autoplay = false } = {}) {
  const g = gameLive(id); if (!g) return;

/* ================= field diagrams ================= */
// Field in metres: x 0-37 across, y 0-100 down the screen. The offence attacks up the screen:
// the endzone it scores in is y 0-18, its own endzone is y 82-100.
const FVIEWS = { end: [0, 46], half: [0, 66], back: [34, 100], full: [0, 100] };
const FVIEW_LABEL = { half: 'Attacking half', end: 'Attacking endzone', back: 'Own half (pull plays)', full: 'Full field' };
const TOK_R = { end: 1.2, half: 1.5, back: 1.5, full: 2.1 };
const PLAY_KINDS = { offence: 'Offence', defence: 'Defence', zone: 'Zone', pull: 'Pull play', endzone: 'Endzone', other: 'Other' };
const r1 = n => Math.round(n * 10) / 10;
const fdView = play => (FVIEWS[play.view] ? play.view : 'half');
const fdDist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const fdSame = (a, b) => !!a && !!b && a[0] === b[0] && a[1] === b[1];
const fdTok = (play, id) => play.tokens.find(t => t.id === id);

function fdSmooth(pts) {
  if (pts.length < 3) return 'M' + pts.map(p => `${r1(p[0])} ${r1(p[1])}`).join('L');
  let d = `M${r1(pts[0][0])} ${r1(pts[0][1])}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const end = i === pts.length - 2 ? b : [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    d += `Q${r1(a[0])} ${r1(a[1])} ${r1(end[0])} ${r1(end[1])}`;
  }
  return d;
}
function fdHead(pts, h) {
  const b = pts[pts.length - 1];
  let a = pts[pts.length - 2];
  for (let i = pts.length - 2; i >= 0 && fdDist(pts[i], b) < h * 0.6; i--) a = pts[i];
  const L = fdDist(a, b) || 1, ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L;
  const bx = b[0] - ux * h, by = b[1] - uy * h, w = h * 0.55;
  return `${r1(b[0])},${r1(b[1])} ${r1(bx - uy * w)},${r1(by + ux * w)} ${r1(bx + uy * w)},${r1(by - ux * w)}`;
}
function fdFieldSvg() {
  return `<rect class="fd-grass" x="0" y="0" width="37" height="100"/>
    <rect class="fd-ez" x="0" y="0" width="37" height="18"/><rect class="fd-ez" x="0" y="82" width="37" height="18"/>
    <rect class="fd-line" x="0" y="0" width="37" height="100" fill="none"/>
    <path class="fd-line" d="M0 18H37M0 82H37" fill="none"/>
    <path class="fd-brick" d="M17.7 35.2l1.6 1.6m0-1.6l-1.6 1.6M17.7 63.2l1.6 1.6m0-1.6l-1.6 1.6" fill="none"/>`;
}
function fdMarkSvg(play, m, idx, R, o) {
  const sel = o.sel && o.sel.mark === idx ? ' sel' : '';
  const hit = o.edit ? ` data-mark="${idx}"` : '';
  if (m.k === 'area') {
    return `<ellipse class="fd-area${sel}"${hit} cx="${m.x}" cy="${m.y}" rx="${m.rx}" ry="${m.ry}" stroke-width="${r1(R * 0.14)}"/>`;
  }
  if (m.k === 'text') {
    return `<text class="fd-text${sel}"${hit} x="${m.x}" y="${m.y}" font-size="${r1(R * 1.25)}" text-anchor="middle" dy=".36em">${esc(m.s)}</text>`;
  }
  if (!m.pts || m.pts.length < 2) return '';
  const who = m.k === 'cut' && m.a ? fdTok(play, m.a) : null;
  const cls = m.k === 'throw' ? 'fd-throw' : 'fd-cut fd-cut-' + (who ? who.t : 'o');
  const d = m.k === 'throw' ? `M${m.pts.map(p => `${p[0]} ${p[1]}`).join('L')}` : fdSmooth(m.pts);
  const sw = r1(R * (m.k === 'throw' ? 0.2 : 0.26));
  return `<g class="${cls}${sel}">
    <path d="${d}" fill="none" stroke-width="${sw}"${m.k === 'throw' ? ` stroke-dasharray="${r1(R * 0.7)} ${r1(R * 0.5)}"` : ''}/>
    <polygon points="${fdHead(m.pts, R * 1.1)}"/>
    ${o.edit ? `<path class="fd-hit"${hit} d="${d}" fill="none" stroke-width="${r1(R * 1.6)}"/>` : ''}
  </g>`;
}
function fdTokSvg(t, p, R, o) {
  const sel = o.sel && o.sel.tok === t.id ? ' sel' : '';
  let shape;
  if (t.t === 'disc') shape = `<circle class="fd-disc" r="${r1(R * 0.5)}" stroke-width="${r1(R * 0.12)}"/>`;
  else if (t.t === 'd') shape = `<rect class="fd-d" x="${r1(-R * 0.9)}" y="${r1(-R * 0.9)}" width="${r1(R * 1.8)}" height="${r1(R * 1.8)}" rx="${r1(R * 0.3)}"/>`;
  else shape = `<circle class="fd-o" r="${R}"/>`;
  const ring = t.ring ? `<circle class="fd-ring" r="${r1(R * 1.45)}" fill="none" stroke-width="${r1(R * 0.16)}"/>` : '';
  const pad = o.edit ? `<circle class="fd-pad" r="${r1(R * (t.t === 'disc' ? 1.1 : 1.5))}"/>` : '';
  const label = t.t !== 'disc' && t.l ? `<text class="fd-lab fd-lab-${t.t}" font-size="${r1(R * 1.15)}" text-anchor="middle" dy=".36em">${esc(t.l)}</text>` : '';
  return `<g class="fd-tok${sel}" data-tok="${t.id}" transform="translate(${p[0]} ${p[1]})">${pad}${ring}${shape}${label}</g>`;
}
// One step of a play as an SVG. o: { edit, sel, ghost }
function fdSvg(play, i, o = {}) {
  const v = fdView(play), [y0, y1] = FVIEWS[v], R = TOK_R[v];
  const st = play.steps[Math.min(i, play.steps.length - 1)] || { pos: {}, marks: [] };
  const marks = st.marks.map((m, idx) => [m, idx]);
  const layer = ks => marks.filter(([m]) => ks.includes(m.k)).map(([m, idx]) => fdMarkSvg(play, m, idx, R, o)).join('');
  const order = t => (t.t === 'disc' ? 1 : 0);
  const toks = [...play.tokens].sort((a, b) => order(a) - order(b)).filter(t => st.pos[t.id]).map(t => fdTokSvg(t, st.pos[t.id], R, o)).join('');
  return `<svg class="fd-svg" data-fv="${v}" viewBox="-1 ${y0 - 1} 39 ${y1 - y0 + 2}" role="img" aria-label="${esc(play.name || 'Field diagram')}" preserveAspectRatio="xMidYMid meet">
    ${fdFieldSvg()}${layer(['area'])}${layer(['cut', 'throw'])}${o.ghost || ''}${layer(['text'])}${toks}</svg>`;
}
// Where everyone ends up after a step's arrows.
function fdDerive(play, i) {
  const st = play.steps[i], pos = clone(st.pos);
  for (const m of st.marks) if (m.k === 'cut' && m.a && pos[m.a]) pos[m.a] = m.pts[m.pts.length - 1].slice();
  const disc = play.tokens.find(t => t.t === 'disc');
  const th = st.marks.filter(m => m.k === 'throw').pop();
  if (disc && th && pos[disc.id]) pos[disc.id] = th.pts[th.pts.length - 1].slice();
  return pos;
}
function fdAlong(pts, f) {
  if (pts.length === 1 || f <= 0) return pts[0];
  if (f >= 1) return pts[pts.length - 1];
  let total = 0;
  const seg = [];
  for (let i = 1; i < pts.length; i++) { const l = fdDist(pts[i - 1], pts[i]); seg.push(l); total += l; }
  if (!total) return pts[0];
  let want = f * total;
  for (let i = 0; i < seg.length; i++) {
    if (want <= seg[i] || i === seg.length - 1) {
      const k = seg[i] ? Math.min(1, want / seg[i]) : 0, a = pts[i], b = pts[i + 1];
      return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
    }
    want -= seg[i];
  }
  return pts[pts.length - 1];
}

/* ---------- diagram player ---------- */
const fd = { step: 0, playing: false, done: false, raf: 0, ft: 0, timer: 0 };
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function fdStop() {
  cancelAnimationFrame(fd.raf); clearTimeout(fd.ft); clearTimeout(fd.timer);
  fd.playing = false; fd.raf = fd.ft = fd.timer = 0;
}
// The diagram on screen: the play being edited, the play being read, or the coaching topic's picture.
function curPlay() {
  if (ui.view === 'playbook') {
    if (ui.pb.edit) return ui.pb.edit.play;
    const p = db.plays[ui.pb.id];
    return p && !p.deleted ? p : null;
  }
  if (ui.view === 'coach') { const t = coachTopic(ui.ch.id); return t ? t.play || null : null; }
  return null;
}
function fdPaint() {
  const play = curPlay(), wrap = $('#fdWrap');
  if (!play || !wrap) return;
  fd.step = clamp(fd.step, 0, play.steps.length - 1);
  fd.done = false;
  const ed = ui.pb.edit;
  wrap.innerHTML = fdSvg(play, fd.step, ed && ui.view === 'playbook' && !fd.playing ? { edit: true, sel: ed.sel, ghost: ed.ghost } : {});
  fdBar();
}
function fdBar() {
  const play = curPlay(), bar = $('#fdBar');
  if (!play || !bar) return;
  const n = play.steps.length, i = fd.step;
  if (ui.pb.edit && ui.view === 'playbook') { bar.innerHTML = pbStepBar(play, i); pbSelBar(); return; }
  bar.innerHTML = `
    <button class="btn small primary" data-act="fdPlay">${fd.playing ? '&#10074;&#10074; Pause' : fd.done ? '&#8635; Replay' : '&#9654; Play'}</button>
    <button class="mini" data-act="fdStep" data-v="-1" aria-label="Previous step"${i === 0 && !fd.done ? ' disabled' : ''}>&lsaquo;</button>
    <span class="fd-count">Step ${i + 1} of ${n}</span>
    <button class="mini" data-act="fdStep" data-v="1" aria-label="Next step"${i >= n - 1 ? ' disabled' : ''}>&rsaquo;</button>`;
  const note = $('#fdNote');
  if (note) note.textContent = play.steps[i].note || '';
}
function fdStep(delta) {
  const play = curPlay();
  if (!play) return;
  const was = fd.done;
  fdStop();
  fd.step = clamp(fd.step + (was && delta < 0 ? 0 : delta), 0, play.steps.length - 1);
  fdPaint();
}
function fdPlay() {
  const play = curPlay();
  if (!play) return;
  if (fd.playing) { fdStop(); fdPaint(); return; }
  if (fd.done) fd.step = 0;
  fdStop();
  fd.playing = true;
  fdPaint();
  fdRun(play);
}
function fdRun(play) {
  const st = play.steps[fd.step];
  const hold = reduceMotion() ? 1800 : Math.min(4200, 700 + (st.note || '').length * 30);
  fd.timer = setTimeout(() => fdMove(play, () => {
    if (fd.step < play.steps.length - 1) { fd.step++; fdPaint(); fdRun(play); }
    else { fd.playing = false; fd.done = true; if (ui.pb.edit && ui.view === 'playbook') fdPaint(); else fdBar(); }
  }), hold);
}
// Slide everyone from this step's positions to the next step's, along their arrows.
function fdMove(play, done) {
  const st = play.steps[fd.step], from = st.pos, to = (play.steps[fd.step + 1] || {}).pos || fdDerive(play, fd.step);
  const wrap = $('#fdWrap');
  const throws = st.marks.filter(m => m.k === 'throw');
  const paths = [];
  for (const t of play.tokens) {
    const a = from[t.id], b = to[t.id], el = wrap && wrap.querySelector(`[data-tok="${t.id}"]`);
    if (!a || !b || !el) continue;
    let pts, delay = 0;
    if (t.t === 'disc') { pts = [a, ...throws.map(m => m.pts[m.pts.length - 1]), b]; delay = throws.length ? 0.3 : 0; }
    else { const cut = st.marks.find(m => m.k === 'cut' && m.a === t.id); pts = cut ? [...cut.pts, b] : [a, b]; }
    if (pts.length === 2 && fdSame(a, b)) continue;
    paths.push({ el, pts, delay });
  }
  const set = f => {
    for (const p of paths) {
      const q = fdAlong(p.pts, clamp((f - p.delay) / (1 - p.delay), 0, 1));
      p.el.setAttribute('transform', `translate(${q[0].toFixed(2)} ${q[1].toFixed(2)})`);
    }
  };
  if (!paths.length || reduceMotion()) { set(1); fd.timer = setTimeout(done, reduceMotion() ? 1400 : 300); return; }
  const dur = 1500, t0 = performance.now();
  const tick = () => {
    cancelAnimationFrame(fd.raf); clearTimeout(fd.ft);
    if (!fd.playing) return;
    const f = clamp((performance.now() - t0) / dur, 0, 1);
    set(f < 0.5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2);
    if (f < 1) { fd.raf = requestAnimationFrame(tick); fd.ft = setTimeout(tick, 120); } // the timer covers a hidden tab
    else { fd.raf = fd.ft = 0; fd.timer = setTimeout(done, 500); }
  };
  tick();
}
const fdPlayerHtml = play => `<div class="fd"><div class="fd-wrap fv-${fdView(play)}" id="fdWrap"></div><div class="fd-bar" id="fdBar"></div><p class="fd-note" id="fdNote" aria-live="polite"></p></div>`;

const playOf = id => { const p = db.plays[id]; return p && !p.deleted ? p : null; };
const clipsOfPlay = id => live('clips').filter(c => gameLive(c.gameId) && (c.playIds || []).includes(id)).sort(byGameThenStart);
const KIND_PILL = { offence: 'o', endzone: 'o', defence: 'd', zone: 'd', pull: 'p', other: '' };
const kindPill = k => `<span class="pill ${KIND_PILL[k] || ''}">${PLAY_KINDS[k] || 'Other'}</span>`;

// Move a token in step j and in the steps after it for as long as it was standing in the same spot.
function pbShift(id, j, old, p) {
  const play = ui.pb.edit.play;
  for (; j < play.steps.length; j++) {
    const s = play.steps[j];
    if (!fdSame(s.pos[id], old)) break;
    s.pos[id] = p.slice();
    for (const m of s.marks) {
      if (m.k === 'cut' && m.a === id) m.pts[0] = p.slice();
      if (m.k === 'throw' && fdSame(m.pts[0], old)) m.pts[0] = p.slice();
    }
  }
}
// Change this step's arrows, then carry the new end points into the following steps.
function pbCommit(fn) {
  const play = ui.pb.edit.play, i = fd.step;
  pbSnap();
  const before = fdDerive(play, i);
  fn();
  const after = fdDerive(play, i);
  for (const t of play.tokens) if (before[t.id] && after[t.id] && !fdSame(before[t.id], after[t.id])) pbShift(t.id, i + 1, before[t.id], after[t.id]);
}
function pbAddTok(type, p) {
  const play = ui.pb.edit.play;
  if (type === 'disc') {
    const d = play.tokens.find(t => t.t === 'disc');
    if (d) { pbShift(d.id, fd.step, play.steps[fd.step].pos[d.id].slice(), p); return d.id; }
    play.tokens.push({ id: 'disc', t: 'disc', l: '' });
    for (const s of play.steps) s.pos.disc = p.slice();
    return 'disc';
  }
  const mine = play.tokens.filter(t => t.t === type);
  if (mine.length >= 9) { toast('That is already nine on the field'); return null; }
  let k = 1, n = 1;
  while (play.tokens.some(t => t.id === type + k)) k++;
  while (mine.some(t => t.l === String(n))) n++;
  play.tokens.push({ id: type + k, t: type, l: String(n) });
  for (const s of play.steps) s.pos[type + k] = p.slice();
  return type + k;
}
function pbPoint(e) {
  const svg = $('#fdWrap svg'), m = svg && svg.getScreenCTM();
  if (!m) return null;
  const inv = m.inverse(), [y0, y1] = FVIEWS[fdView(ui.pb.edit.play)];
  return [r1(clamp(inv.a * e.clientX + inv.c * e.clientY + inv.e, 0, 37)), r1(clamp(inv.b * e.clientX + inv.d * e.clientY + inv.f, y0, y1))];
}
function rdp(pts, eps) {
  if (pts.length < 3) return pts.slice();
  const a = pts[0], b = pts[pts.length - 1], L = fdDist(a, b);
  let worst = 0, at = 0;
  for (let i = 1; i < pts.length - 1; i++) {
    const p = pts[i];
    const d = L ? Math.abs((b[0] - a[0]) * (a[1] - p[1]) - (a[0] - p[0]) * (b[1] - a[1])) / L : fdDist(p, a);
    if (d > worst) { worst = d; at = i; }
  }
  if (worst <= eps) return [a, b];
  return [...rdp(pts.slice(0, at + 1), eps).slice(0, -1), ...rdp(pts.slice(at), eps)];
}
function pbGhost(g, R) {
  const sw = r1(R * 0.26);
  if (g.k === 'cut') return g.pts.length > 1 ? `<path class="fd-ghost" d="M${g.pts.map(p => p.join(' ')).join('L')}" fill="none" stroke-width="${sw}"/>` : '';
  if (g.k === 'throw') return `<path class="fd-ghost" d="M${g.from.join(' ')}L${g.to.join(' ')}" fill="none" stroke-width="${sw}" stroke-dasharray="${r1(R * 0.7)} ${r1(R * 0.5)}"/>`;
  if (g.k === 'area') return `<ellipse class="fd-ghost" cx="${(g.from[0] + g.to[0]) / 2}" cy="${(g.from[1] + g.to[1]) / 2}" rx="${Math.abs(g.to[0] - g.from[0]) / 2}" ry="${Math.abs(g.to[1] - g.from[1]) / 2}" fill="none" stroke-width="${sw}"/>`;
  return '';
}
function pbDown(e) {
  const ed = ui.pb.edit;
  if (!ed || fd.playing || ui.view !== 'playbook' || e.button || !e.target.closest('#fdWrap')) return;
  const p = pbPoint(e);
  if (!p) return;
  e.preventDefault();
  if (document.activeElement && document.activeElement.blur && hubTyping()) document.activeElement.blur();
  const play = ed.play, st = play.steps[fd.step], R = TOK_R[fdView(play)];
  const tokEl = e.target.closest('[data-tok]'), markEl = e.target.closest('[data-mark]');
  let g = null;
  switch (ed.tool) {
    case 'move':
      if (tokEl && st.pos[tokEl.dataset.tok]) {
        const id = tokEl.dataset.tok, q = st.pos[id];
        ed.sel = { tok: id };
        g = { k: 'tok', id, off: [q[0] - p[0], q[1] - p[1]], start: p, live: false };
      } else if (markEl && st.marks[+markEl.dataset.mark]) {
        const idx = +markEl.dataset.mark, m = st.marks[idx];
        ed.sel = { mark: idx };
        if (m.k === 'area' || m.k === 'text') g = { k: 'mark', idx, off: [m.x - p[0], m.y - p[1]], start: p, live: false };
      } else ed.sel = null;
      break;
    case 'o': case 'd': case 'disc': {
      pbSnap();
      const id = pbAddTok(ed.tool, p);
      if (!id) { ed.undo.pop(); break; }
      ed.sel = { tok: id };
      g = { k: 'tok', id, off: [0, 0], start: p, live: true };
      if (ed.tool === 'disc') ed.tool = 'move';
      break;
    }
    case 'cut': {
      const near = play.tokens.filter(t => t.t !== 'disc' && st.pos[t.id]).map(t => [t, fdDist(st.pos[t.id], p)]).sort((a, b) => a[1] - b[1])[0];
      const a = near && near[1] <= R * 2.4 ? near[0] : null;
      g = { k: 'cut', a: a ? a.id : null, pts: [a ? st.pos[a.id].slice() : p] };
      break;
    }
    case 'throw': {
      const last = st.marks.filter(m => m.k === 'throw').pop(), disc = play.tokens.find(t => t.t === 'disc');
      g = { k: 'throw', from: last ? last.pts[last.pts.length - 1].slice() : disc && st.pos[disc.id] ? st.pos[disc.id].slice() : p, to: p };
      break;
    }
    case 'area': g = { k: 'area', from: p, to: p }; break;
    case 'text': {
      pbSnap();
      st.marks.push({ k: 'text', x: p[0], y: p[1], s: 'Label' });
      ed.sel = { mark: st.marks.length - 1 }; ed.tool = 'move';
      fdPaint();
      const inp = $('#pbMarkText');
      if (inp) { inp.focus(); inp.select(); }
      return;
    }
  }
  ed.drag = g;
  if (g) { try { $('#hub').setPointerCapture(e.pointerId); } catch (err) { /* older browsers */ } }
  fdPaint();
}
function pbDrag(e) {
  const ed = ui.pb.edit, g = ed && ed.drag;
  if (!g) return;
  const p = pbPoint(e);
  if (!p) return;
  const play = ed.play, st = play.steps[fd.step], R = TOK_R[fdView(play)], [y0, y1] = FVIEWS[fdView(play)];
  if (g.k === 'tok' || g.k === 'mark') {
    if (!g.live) { if (fdDist(p, g.start) < 0.6) return; pbSnap(); g.live = true; }
    const q = [r1(clamp(p[0] + g.off[0], 0, 37)), r1(clamp(p[1] + g.off[1], y0, y1))];
    if (g.k === 'tok') pbShift(g.id, fd.step, st.pos[g.id].slice(), q);
    else { st.marks[g.idx].x = q[0]; st.marks[g.idx].y = q[1]; }
  } else {
    if (g.k === 'cut') { if (fdDist(g.pts[g.pts.length - 1], p) >= 0.6) g.pts.push(p); }
    else g.to = p;
    ed.ghost = pbGhost(g, R);

function pbUp(e) {
  const ed = ui.pb.edit, g = ed && ed.drag;
  if (!g) return;
  ed.drag = null; ed.ghost = '';
  try { $('#hub').releasePointerCapture(e.pointerId); } catch (err) { /* nothing held */ }
  const st = ed.play.steps[fd.step];
  const add = m => { st.marks.push(m); ed.sel = { mark: st.marks.length - 1 }; };
  if (e.type !== 'pointercancel') {
    if (g.k === 'cut') {
      const pts = rdp(g.pts, 0.7).map(q => [r1(q[0]), r1(q[1])]);
      if (fdDist(pts[0], pts[pts.length - 1]) >= 2) pbCommit(() => {
        if (g.a) st.marks = st.marks.filter(m => !(m.k === 'cut' && m.a === g.a)); // one run per player per step
        add(g.a ? { k: 'cut', pts, a: g.a } : { k: 'cut', pts });

    } else if (g.k === 'throw') {
      if (fdDist(g.from, g.to) >= 2) pbCommit(() => add({ k: 'throw', pts: [g.from, g.to] }));
    } else if (g.k === 'area') {
      const rx = r1(Math.abs(g.to[0] - g.from[0]) / 2), ry = r1(Math.abs(g.to[1] - g.from[1]) / 2);
      if (rx >= 1 && ry >= 1) { pbSnap(); add({ k: 'area', x: r1((g.from[0] + g.to[0]) / 2), y: r1((g.from[1] + g.to[1]) / 2), rx, ry }); }
    }
  }

}
function pbDelSel() {
  const ed = ui.pb.edit, s = ed && ed.sel;

    for (const x of play.steps) { delete x.pos[s.tok]; x.marks = x.marks.filter(m => !(m.k === 'cut' && m.a === s.tok)); }
  } else if (s.mark != null && st.marks[s.mark]) pbCommit(() => st.marks.splice(s.mark, 1));
  ed.sel = null;

}
function pbStepEdit(what, v) {
  const ed = ui.pb.edit;
  if (!ed) return;
  const play = ed.play, i = fd.step;
  fdStop();
  if (what === 'go') fd.step = clamp(+v, 0, play.steps.length - 1);

/* ================= coaching hub ================= */
const COACH_SECS = ['Offence', 'Defence', 'Game day', 'Drills', 'Practice plans'];
const SEC_NOTE = {
  Offence: 'Stacks, resets, the endzone and the deep game.',
  Defence: 'The force, the mark, help defence and zones.',
  'Game day': 'Mixed match-ups, wind, turnovers and time-outs.',
  Drills: 'Pick the skill you want to train.',
  'Practice plans': 'Ready-made sessions built from the drills, with a clock.',
};
const DRILL_SKILLS = { throw: 'Throwing', break: 'Breaks and marking', reset: 'Handlers and resets', cut: 'Cutting', deep: 'Deep game', def: 'Defence', zone: 'Zone', endzone: 'Endzone', warm: 'Warm-up and fitness', game: 'Games' };
const DRILL_LEVELS = { 1: 'Basics', 2: 'Intermediate', 3: 'Advanced' };
const DRILL_MAX = { 0: 'Any number', 4: '2 to 4 players', 10: '5 to 10 players' };
// Words people type that the pages spell another way.
const CH_SYN = { flick: 'forehand', forehand: 'flick', dump: 'reset', defense: 'defence', offense: 'offence', long: 'huck', hucks: 'huck', warmup: 'warm-up', fitness: 'conditioning', scrimmage: 'game', man: 'person', d: 'defence', o: 'offence', throws: 'throw', pulls: 'pull', poaching: 'poach' };

const coachTopic = id => COACH_TOPICS.find(t => t.id === id) || null;
const coachIn = sec => COACH_TOPICS.filter(t => t.sec === sec);
const coachClips = t => live('clips').filter(c => gameLive(c.gameId) && (c.tags || []).some(x => t.tags.includes(x)));
const coachTake = id => (db.coach[id] && db.coach[id].text) || '';
const isDrill = t => t.sec === 'Drills';
const isPlan = t => t.sec === 'Practice plans';
const planMins = t => t.plan.reduce((n, r) => n + r[0], 0);
const drillsFor = id => COACH_TOPICS.filter(t => isDrill(t) && t.for.includes(id));
const plansWith = id => COACH_TOPICS.filter(t => isPlan(t) && t.plan.some(r => r[1] === id));
// The shelf a page sits on: its section, or for a drill the skill it trains.
const coachGroup = t => (isDrill(t) ? COACH_TOPICS.filter(x => isDrill(x) && x.skill === t.skill) : coachIn(t.sec));
const coachGroupName = t => (isDrill(t) ? DRILL_SKILLS[t.skill] : t.sec);
function coachMeta(t) {
  if (isDrill(t)) return `${t.n} · ${t.mins} min · ${DRILL_LEVELS[t.level]}`;
  if (isPlan(t)) return `${planMins(t)} min · ${t.focus}`;
  const n = drillsFor(t.id).length;
  return n ? plural(n, 'drill') : '';
}
const coachLines = t => [
  ...t.body.flatMap(([, items]) => items),
  ...(t.plan || []).flatMap(r => { const d = coachTopic(r[1]); return [d ? d.title : r[1], r[2] || '']; }),
];
function coachSearch(q) {
  const words = q.toLowerCase().split(/[^a-z0-9-]+/).filter(Boolean).slice(0, 6);
  const out = [];
  if (!words.length) return out;
  for (const t of COACH_TOPICS) {
    const title = t.title.toLowerCase();
    const head = [t.sec, isDrill(t) ? DRILL_SKILLS[t.skill] : '', t.focus || '', ...t.tags, t.blurb].join(' ').toLowerCase();
    const lines = coachLines(t);
    let score = 0, snip = '', ok = true;
    for (const w of words) {
      const alts = [w, CH_SYN[w]].filter(Boolean), has = s => alts.some(a => s.includes(a));
      if (has(title)) score += 10;
      else if (has(head)) score += 4;

// Diagram shorthand for the built-in topics. o / d: starting spots; disc: a spot or the holder's id.
// Each step is [caption, ...ops]:  ['c', id, ...points] run with an arrow · ['m', id, point] move, no arrow
// ['f', defender, attacker] defender stays with their player · ['t', id or point] throw · ['a', x, y, rx, ry] shaded area · ['x', x, y, text] label
const DISC_OFF = [1.3, 0.5];
const mkMark = op => (op[0] === 'a' ? { k: 'area', x: op[1], y: op[2], rx: op[3], ry: op[4] } : { k: 'text', x: op[1], y: op[2], s: op[3] });
function mk(view, o, d, disc, steps, extra = {}) {
  const tokens = [], cur = {};
  o.forEach((p, i) => { tokens.push({ id: 'o' + (i + 1), t: 'o', l: String(i + 1) }); cur['o' + (i + 1)] = p; });
  d.forEach((p, i) => { tokens.push({ id: 'd' + (i + 1), t: 'd', l: String(i + 1) }); cur['d' + (i + 1)] = p; });
  const held = (pos, x) => (typeof x === 'string' ? [r1(pos[x][0] + DISC_OFF[0]), r1(pos[x][1] + DISC_OFF[1])] : x);
  if (disc) { tokens.push({ id: 'disc', t: 'disc', l: '' }); cur.disc = held(cur, disc); }
  for (const id of extra.ring || []) tokens.find(t => t.id === id).ring = true;
  const out = [];
  for (const [note, ...ops] of steps) {
    const next = { ...cur }, marks = (extra.keep || []).map(mkMark);
    for (const op of ops) {
      if (op[0] === 'c') { const pts = op.slice(2); marks.push({ k: 'cut', a: op[1], pts: [cur[op[1]], ...pts] }); next[op[1]] = pts[pts.length - 1]; }
      else if (op[0] === 'm') next[op[1]] = op[2];
      else if (op[0] === 'a' || op[0] === 'x') marks.push(mkMark(op));
    }
    for (const op of ops) if (op[0] === 'f') next[op[1]] = [r1(next[op[2]][0] + cur[op[1]][0] - cur[op[2]][0]), r1(next[op[2]][1] + cur[op[1]][1] - cur[op[2]][1])];
    let from = cur.disc;
    for (const op of ops) if (op[0] === 't') { const to = held(next, op[1]); marks.push({ k: 'throw', pts: [from, to] }); from = to; next.disc = to; }
    out.push({ pos: { ...cur }, marks, note });
    Object.assign(cur, next);
  }
  return { view, tokens, steps: out };
}

    plays: p.plays.filter(x => inP(x.createdAt)).length,

/* ================= game stats: record a game point by point while the video plays =================
   Each point is a small document of its own in db.x (kind "sp"), so it syncs as an "x-…" document in the "meta"
   collection the database rules already allow, and two people recording different points never overwrite each other.
   A point: gameId · n (its place in the game) · start ('O' we received, 'D' we pulled) · line (player ids)
   · t0 (where it starts in the video) · ev (what happened, in order) · out ('us', 'them' or '' while it is being played).
   An event: k = pick (picks up the disc) · pass · goal · turn (w: throwaway, drop or stall) · block · tturn (they
   turned it over) · tgoal (they scored) · a = thrower or holder · b = receiver, dropper or defender · t = video time.
   Who has the disc is worked out by replaying the events and is never stored. */
ui.st = { tab: 'rec', gid: null, pid: null, mode: null, start: 'O', line: [], open: null, fig: null, all: false };
// Personal plus/minus: +1 for each goal, assist and block, +0.5 for each hockey assist (the throw before the
// assist), -1 for each turnover of their own. Being on a line that scores earns nothing.
const stValue = r => r.g + r.a + r.blk + (r.ha || 0) / 2 - r.to;
const stSigned = v => `${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v)}`;
const ST_FIGS = { pts: 'Points played', pm: 'Plus/minus', on: 'On-field result', g: 'Goals', a: 'Assists', ha: 'Hockey assists', thr: 'Throws', cmp: 'Completed', to: 'Turnovers', blk: 'Blocks' };
const ST_MAX_LINE = 7;

const stPoints = gameId => xs('sp').filter(p => p.gameId === gameId).sort((a, b) => (a.n || 0) - (b.n || 0) || (a.createdAt || 0) - (b.createdAt || 0));
const stPoint = () => { const p = xGet(ui.st.pid); return p && p.kind === 'sp' && p.gameId === ui.gameId ? p : null; };
const stWho = id => db.players[id]?.name || 'Someone';
const stRoster = () => ourPlayers().sort((a, b) => (parseInt(a.number, 10) || 999) - (parseInt(b.number, 10) || 999) || a.name.localeCompare(b.name));
const stUsTeam = g => g.teamIds.find(isUs) || ourTeams()[0]?.id || null;
const stNow = () => Math.round(curTime() * 10) / 10;
const stCanRecord = g => !!g && !g.teamIds.every(isLib);

function stState(p) {
  let ours = p.start === 'O', holder = null;
  for (const e of p.ev || []) {
    if (e.k === 'pick') { ours = true; holder = e.a; }
    else if (e.k === 'pass') holder = e.b;
    else if (e.k === 'turn') { ours = false; holder = null; }
    else if (e.k === 'block' || e.k === 'tturn') { ours = true; holder = null; }
  }
  return { ours, holder };
}
// The score once this point is over: [us, them].
function stScore(pts, upTo) {
  let us = 0, them = 0;
  for (const p of pts) {
    if (p.out === 'us') us++; else if (p.out === 'them') them++;
    if (upTo && p.id === upTo.id) break;
  }
  return [us, them];
}
function stResult(p) {
  if (!p.out) return { label: 'In play', cls: 'p' };
  if (p.out === 'us') return { label: p.start === 'O' ? 'Hold' : 'Break', cls: 'good' };
  return { label: p.start === 'O' ? 'Broken' : 'Conceded', cls: 'fix' };
}
function stDescribe(e) {
  switch (e.k) {
    case 'pick': return { text: `${stWho(e.a)} picks it up`, cls: '' };
    case 'pass': return { text: `${stWho(e.a)} → ${stWho(e.b)}`, cls: '' };
    case 'goal': return { text: `Goal: ${stWho(e.a)} → ${stWho(e.b)}`, cls: 'good' };
    case 'turn': return { text: e.w === 'drop' ? `Drop by ${stWho(e.b)}, thrown by ${stWho(e.a)}` : e.w === 'stall' ? `Stall on ${stWho(e.a)}` : e.w === 'blocked' ? `Blocked: throw by ${stWho(e.a)}` : `Throwaway by ${stWho(e.a)}`, cls: 'bad' };
    case 'tpass': return { text: 'Their pass', cls: 'their' };
    case 'block': return { text: `Block by ${stWho(e.b)}`, cls: 'good' };
    case 'tturn': return { text: `${e.w === 'drop' ? 'Their drop' : e.w === 'stall' ? 'Their stall' : e.w === 'throwaway' ? 'Their throwaway' : 'They turned it over'}${e.mm ? ` (${e.mm} match-up)` : ''}`, cls: 'their' };
    case 'tgoal': return { text: 'They scored', cls: 'bad' };
    default: return { text: '', cls: '' };
  }
}
// What one event adds to whose figures: [player id, figure]. The box score and the list behind each figure both
// read this, so a list can never disagree with the number that opens it.
function stCharges(e) {
  switch (e.k) {
    case 'pass': return [[e.a, 'thr'], [e.a, 'cmp']];
    case 'goal': return [[e.a, 'thr'], [e.a, 'cmp'], [e.a, 'a'], [e.b, 'g']];
    case 'turn': return e.w === 'drop' ? [[e.a, 'thr'], [e.b, 'to']] : e.w === 'stall' ? [[e.a, 'to']] : [[e.a, 'thr'], [e.a, 'to']];
    case 'block': return [[e.b, 'blk']];
    default: return [];
  }
}
function stBox(pts) {
  const rows = new Map();
  const row = id => { if (!rows.has(id)) rows.set(id, { id, pts: 0, w: 0, l: 0, g: 0, a: 0, ha: 0, thr: 0, cmp: 0, to: 0, blk: 0 }); return rows.get(id); };
  const team = { us: 0, them: 0, oPts: 0, holds: 0, dPts: 0, breaks: 0, to: 0, blk: 0, thr: 0, cmp: 0 };
  for (const p of pts) {
    for (const id of p.line || []) { const r = row(id); r.pts++; if (p.out === 'us') r.w++; else if (p.out === 'them') r.l++; }
    if (p.out) {
      team[p.out]++;
      if (p.start === 'O') { team.oPts++; if (p.out === 'us') team.holds++; } else { team.dPts++; if (p.out === 'us') team.breaks++; }
    }
    let prev = null; // the last completed pass of this possession: its thrower gets the hockey assist if the next throw scores
    for (const e of p.ev || []) {
      if (e.k === 'goal' && prev && prev.a) row(prev.a).ha++;
      prev = e.k === 'pass' ? e : null;
      if (e.k === 'turn') team.to++;
      for (const [id, fig] of stCharges(e)) { if (!id) continue; row(id)[fig]++; if (fig === 'thr' || fig === 'cmp' || fig === 'blk') team[fig]++; }
    }
  }
  const list = [...rows.values()].sort((a, b) => b.pts - a.pts || stWho(a.id).localeCompare(stWho(b.id)));
  return { team, rows: list };
}
// The points or plays behind one figure of one player, oldest first.
function stMoments(pts, playerId, fig) {
  const out = [];
  for (const p of pts) {
    if (fig === 'pm' || fig === 'ha') { // every play that moved their personal plus/minus, with its sign
      let prev = null;
      for (const e of p.ev || []) {
        if (e.k === 'goal' && prev && prev.a === playerId) out.push({ p, t: prev.t || 0, text: `${fig === 'pm' ? '+½  ' : ''}Hockey assist: ${stWho(prev.a)} → ${stWho(prev.b)}, who threw the goal`, cls: 'good' });
        prev = e.k === 'pass' ? e : null;
        if (fig === 'pm') for (const [id, f] of stCharges(e)) if (id === playerId && (f === 'g' || f === 'a' || f === 'blk' || f === 'to')) { const d = stDescribe(e); out.push({ p, t: e.t || 0, text: `${f === 'to' ? '−1' : '+1'}  ${d.text}`, cls: f === 'to' ? 'bad' : 'good' }); }
      }
      continue;
    }
    if (fig === 'pts' || fig === 'on') {
      if ((p.line || []).includes(playerId) && (fig === 'pts' || p.out)) out.push({ p, t: p.t0 || 0, text: `${p.start === 'O' ? 'Our O' : 'Our D'} · ${stResult(p).label}`, cls: !p.out ? '' : p.out === 'us' ? 'good' : 'bad' });
      continue;
    }
    const want = fig === 'cmp' ? 'thr' : fig; // "completed" lists every throw: the rate is no use without the ones that were not
    for (const e of p.ev || []) if (stCharges(e).some(([id, f]) => id === playerId && f === want)) out.push({ p, t: e.t || 0, ...stDescribe(e) });
  }
  return out;
}

// Called whenever the panel is drawn: a different game starts from its own last point.
function stFollowGame(g) {
  if (ui.st.gid === g.id) return;
  const pts = stPoints(g.id), last = pts[pts.length - 1];
  Object.assign(ui.st, { gid: g.id, mode: null, open: null, line: [], pid: last && !last.out ? last.id : null, start: last && last.out === 'us' ? 'D' : 'O' });
  if (!ui.st.all) ui.st.fig = null;
}
function stOpen() {
  if (ui.mode === 'stats' && ui.view === 'film' && !ui.profileId && !ui.teamProfile) { setMode('study'); return; }
  if (ui.view !== 'film') setView('film');
  setMode('stats'); setScreen('watch');
}
function stBegin() {
  const g = gameLive(ui.gameId);
  if (!g) return;
  if (!ui.st.line.length) { toast('Pick who is on the line first.'); return; }
  const pts = stPoints(g.id);
  const p = xNew('sp', { gameId: g.id, n: (pts[pts.length - 1]?.n || 0) + 1, start: ui.st.start, line: [...ui.st.line], t0: stNow(), ev: [], out: '' });
  Object.assign(ui.st, { pid: p.id, mode: null, open: null });
  renderPanel();
}
function stAdd(p, e) {
  p.ev = [...(p.ev || []), { ...e, t: stNow() }];
  if (e.k === 'goal') p.out = 'us'; else if (e.k === 'tgoal') p.out = 'them';
  ui.st.mode = null; ui.st.lineOpen = false;
  if (e.k === 'turn' || e.k === 'tturn' || e.k === 'block') { ui.st.z = ''; ui.st.mm = ''; } // those were for this turnover only
  xPut(p); renderPanel();
}
function stTap(id) {
  const p = stPoint();
  if (!p || p.out || !db.players[id]) return;
  const s = stState(p), m = ui.st.mode;
  if (!s.ours) { stAdd(p, { k: 'block', b: id, ...(ui.st.mm ? { mm: ui.st.mm } : {}) }); return; }
  if (!s.holder) { stAdd(p, { k: 'pick', a: id }); return; }
  if (id === s.holder) { toast(`${stWho(id)} already has the disc. Tap who they throw to.`); return; }
  if (m === 'drop') stAdd(p, { k: 'turn', w: 'drop', a: s.holder, b: id, ...(ui.st.z ? { z: ui.st.z } : {}) });
  else stAdd(p, { k: m === 'goal' ? 'goal' : 'pass', a: s.holder, b: id });
}
function stDo(v) {
  const p = stPoint();
  if (!p || p.out) return;
  const s = stState(p);
  if (v === 'tpass' || v === 'tgoal') { if (!s.ours) stAdd(p, { k: v }); return; }
  if (v.startsWith('tturn')) { // "tturn" alone, or with how they lost it: tturn:throwaway, tturn:drop, tturn:stall
