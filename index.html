/* ---------- roster: import players from a CSV ----------
   A file or pasted rows with a name, a shirt number and a gender, in any order, with or without a header row.
   Somebody already on the roster (same name) gets their number and match-up updated instead of being added twice. */
function csvRows(text) {
  text = String(text || '').replace(/^﻿/, '');
  const first = text.split(/\r?\n/).find(l => l.trim()) || '';
  const delim = [',', ';', '\t'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = [];
  let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c !== '"') cell += c;
      else if (text[i + 1] === '"') { cell += '"'; i++; }
      else quoted = false;
    }
    else if (c === '"' && !cell.trim()) { quoted = true; cell = ''; }
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  row.push(cell); rows.push(row);
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(Boolean));
}
const CSV_W = new Set(['f', 'female', 'w', 'woman', 'women', 'fmp', 'femalematching', 'girl', 'v', 'vrou', 'vroulik']);
const CSV_M = new Set(['m', 'male', 'man', 'men', 'mmp', 'malematching', 'open', 'o', 'boy', 'manlik']);
const csvMatch = v => { const k = norm(v).replace(/[^a-z]/g, ''); return CSV_W.has(k) ? 'W' : CSV_M.has(k) ? 'M' : ''; };
const CSV_HEADS = [
  ['name', /^(name|player|playername|fullname|naam|speler)$/], ['first', /^(first|firstname|given|givenname|voornaam)$/],
  ['middle', /^(middle|middlename)$/], ['last', /^(last|lastname|surname|familyname|van)$/],
  ['number', /^(number|num|no|nr|#|shirt|shirtnumber|shirtno|jersey|jerseynumber|jerseyno|nommer)$/],
  ['match', /^(gender|sex|match|matchup|matching|division|geslag)$/],
];
function csvPlayers(text) {
  const rows = csvRows(text);
  if (!rows.length) return { players: [], skipped: 0 };
  const width = Math.max(...rows.map(r => r.length));
  const cols = Array.from({ length: width }, (_, i) => { const h = norm(rows[0][i]).replace(/[^a-z#]/g, ''); return (CSV_HEADS.find(([, re]) => re.test(h)) || [''])[0]; });
  const body = cols.some(Boolean) ? rows.slice(1) : rows;
  if (!cols.some(c => c === 'name' || c === 'first' || c === 'last')) {
    // No name column was named, so work the unnamed columns out from what is in them.
    for (let i = 0; i < width; i++) {
      if (cols[i]) continue;
      const vals = body.map(r => r[i] || '').filter(Boolean);
      if (!vals.length) continue;
      if (!cols.includes('number') && vals.every(v => /^#?\d{1,3}$/.test(v))) cols[i] = 'number';
      else if (!cols.includes('match') && vals.every(csvMatch)) cols[i] = 'match';
      else cols[i] = 'text';
    }
  }
  const seen = new Map();
  let skipped = 0;
  for (const r of body) {
    const get = k => { const i = cols.indexOf(k); return i < 0 ? '' : r[i] || ''; };
    const name = (get('name') || [get('first'), get('middle'), get('last')].filter(Boolean).join(' ') || cols.map((c, i) => (c === 'text' ? r[i] || '' : '')).filter(Boolean).join(' ')).replace(/\s+/g, ' ').trim().slice(0, 40);
    if (!name) { skipped++; continue; }
    seen.set(norm(name), { name, number: get('number').replace(/\D/g, '').slice(0, 3), match: csvMatch(get('match')) });
  }
  return { players: [...seen.values()], skipped };
}
function rosterCsvDialog() {
  const t = ourTeams()[0];
  if (!t) { toast('Add a team under Our team first.'); return; }
  let found = { players: [], skipped: 0 };
  const onRoster = () => new Map(ourPlayers().map(p => [norm(p.name), p]));
  openDialog(`
    <h2>Import players</h2>
    <p class="muted">Into ${esc(t.name)}. Each row is one player: a <b>name</b>, a <b>shirt number</b> and a <b>gender</b> (F or M, which sets their W or M match-up). The columns can be in any order and a header row is optional.</p>
    <label class="field"><span class="eyebrow">CSV file</span><input type="file" name="file" accept=".csv,.tsv,.txt,text/csv,text/plain"></label>
    <label class="field"><span class="eyebrow">Or paste the rows</span><textarea name="csv" rows="6" spellcheck="false" placeholder="name,number,gender&#10;Alice Chen,7,F&#10;Bob Okafor,2,M"></textarea></label>
    <div id="roCsvPreview"><p class="hint">Nothing to import yet.</p></div>
    <div class="dlg-actions"><span class="spacer"></span><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="save" id="roCsvGo" disabled>Import</button></div>`,
  () => {
    if (!found.players.length) return false;
    const cur = onRoster();
    let added = 0, updated = 0;
    for (const x of found.players) {
      const p = cur.get(norm(x.name));
      if (!p) { const np = touch({ id: uid('pl'), teamId: t.id, number: x.number, name: x.name, role: '', hand: '', threat: 0, notes: '', match: x.match }); db.players[np.id] = np; added++; continue; }
      const before = `${p.number}|${p.match || ''}`;
      if (x.number) p.number = x.number;
      if (x.match) p.match = x.match;
      if (before !== `${p.number}|${p.match || ''}`) { touch(p); updated++; }
    }
    save(); renderRail();
    if (ui.view !== 'film') renderHub(); else renderPanel();
    toast(`${plural(added, 'player')} added${updated ? `, ${updated} updated` : ''}.`);
    return true;
  },
  form => {
    const show = () => {
      found = csvPlayers(form.csv.value);
      const cur = onRoster(), ps = found.players, known = ps.filter(x => cur.has(norm(x.name))).length, noMatch = ps.filter(x => !x.match).length;
      $('#roCsvGo', form).disabled = !ps.length;
      $('#roCsvGo', form).textContent = ps.length ? `Import ${plural(ps.length, 'player')}` : 'Import';
      $('#roCsvPreview', form).innerHTML = !ps.length ? `<p class="hint">${form.csv.value.trim() ? 'No player names found in that.' : 'Nothing to import yet.'}</p>`
        : `<p class="hint">${plural(ps.length - known, 'new player')}${known ? `, ${known} already on the roster (their number and match-up are updated)` : ''}.${noMatch ? ` ${noMatch} with no gender, so no match-up.` : ''}${found.skipped ? ` ${plural(found.skipped, 'row')} with no name left out.` : ''}</p>
          <ul class="csv-list">${ps.map(x => `<li><span class="mono">${x.number ? '#' + esc(x.number) : '–'}</span><span class="w">${esc(x.name)}</span><span class="pill ${x.match ? 'p' : ''}">${x.match || '?'}</span><span class="muted">${cur.has(norm(x.name)) ? 'on the roster' : 'new'}</span></li>`).join('')}</ul>`;
    };
    form.csv.addEventListener('input', show);
    form.file.addEventListener('change', async () => {
      const f = form.file.files[0];
      if (!f) return;
      try { form.csv.value = await f.text(); } catch { toast('That file could not be read.'); return; }
      show();
    });
  }, true);
}

/* ================= stats: the panel, the games that have stats, and following one player =================
   Following one player needs no roster and no line: pick or add a single player on any team, then log each throw
   (type, distance, side, who it went to, how it ended). One document per player per game in db.x (kind "tk"),
   id "x-tk-<game>-<player>", so it syncs like the other extras.
   An event: k = th (a throw: ty type · d distance · s side · to receiver · r result) · gl caught a goal

/* ================= AI brief: everything we know about an opponent, turned into a brief the team can study =================
   Claude is called straight from the page with an Anthropic API key that one person (usually the organiser) pastes
   in. The key stays in that browser only: it is never synced to the team room and never part of this file.
   The finished brief is an extras document (kind "ab", id "x-ab-<team>"), so everyone can read it without a key. */
const KEY_AI = ns('filmroom.aikey');
const AI_MODEL = 'claude-opus-5-5';
const AI_SDK = 'https://esm.sh/@anthropic-ai/sdk@1.8.0';
const ai = { busy: null, chars: 0, error: '', errTeam: null, errSeen: false, doneFor: null, stop: null, stopped: false, sdk: null };
const aiKey = () => store.get(KEY_AI) || '';
const abId = teamId => `x-ab-${teamId}`;
const abOf = teamId => { const o = xGet(abId(teamId)); return o && o.kind === 'ab' && o.brief ? o : null; };
const aiSdk = () => (ai.sdk ||= import(AI_SDK).then(m => m.default).catch(e => { ai.sdk = null; throw e; }));

// Writing carries on while you use the rest of the app. This notice shows on every page except the game plan that
// is being written, and afterwards says the brief is ready (or did not finish) until you open it.
function aiChipRender() {
  const el = $('#aiChip');
  if (!el) return;
  const id = ai.busy || ai.doneFor || (ai.error && !ai.errSeen ? ai.errTeam : null), t = id && db.teams[id];
  if (!t || (ui.view === 'plans' && ui.gp.id === id)) { el.hidden = true; return; }
  el.hidden = false; el.dataset.id = id;
  el.className = `ai-chip ${ai.busy ? 'busy' : ai.doneFor ? 'done' : 'bad'}`;
  el.textContent = ai.busy ? `Writing the brief on ${t.name}…${ai.chars ? ` ${ai.chars.toLocaleString()} characters` : ''}`
    : ai.doneFor ? `The brief on ${t.name} is ready. Open it` : `The brief on ${t.name} did not finish. See why`;
}
addEventListener('beforeunload', e => { if (ai.busy) { e.preventDefault(); e.returnValue = ''; } }); // closing the tab would stop it
const aiObj = props => ({ type: 'object', properties: props, required: Object.keys(props), additionalProperties: false });
const aiList = items => ({ type: 'array', items });
const aiStr = { type: 'string' };
const AI_SCHEMA = aiObj({
  headline: aiStr, summary: aiStr,
  their_offence: aiList(aiObj({ point: aiStr, clips: aiList(aiStr) })),
  their_defence: aiList(aiObj({ point: aiStr, clips: aiList(aiStr) })),
  key_players: aiList(aiObj({ name: aiStr, danger: aiStr, how_to_stop: aiStr, clips: aiList(aiStr) })),
  keys_to_win: aiList(aiStr), our_offence: aiList(aiStr), our_defence: aiList(aiStr),
  matchups: aiList(aiObj({ their_player: aiStr, our_player: aiStr, why: aiStr })),
  plays_to_run: aiList(aiObj({ play: aiStr, why: aiStr })),
  must_watch: aiList(aiObj({ clip: aiStr, why: aiStr })),
  gaps: aiList(aiStr),
  player_message: aiStr,
});
const AI_SYSTEM = `You are an experienced ultimate frisbee coach and analyst preparing a mixed-division club team for one specific opponent. You are given everything the team's film group has recorded about that opponent: notes, tagged video clips with their comments, player profiles, statistics, and the team's own roster, lines and playbook.

Write the brief the captain would write if they had the time: specific, grounded in the evidence, and usable by a player who has not watched any of the film. The goal is that every player ends up with the same understanding of how to shut this team down as the people who did the scouting.

How to work:
- Use only what is in the material. Do not invent tendencies, players, numbers or plays. Where the evidence is thin (a single clip or a single note), say so in plain words instead of presenting it as a habit.
- Weigh the evidence. Several clips showing the same thing matter more than one. Clips marked MUST WATCH and the organiser's own notes carry extra weight. Notice patterns across clips that no single note spells out, and contradictions between notes.
- Be concrete about what to do: who, where on the field, which force, which defensive look, which cut to take away. "Force backhand and front number 7 on the reset" is useful; "apply pressure" is not.
- Cite the clips that show each point by their id (C1, C2 and so on) in the "clips" fields, strongest first, at most four per point. Never write clip ids inside the prose.
- "must_watch" is the short list of clips, eight at most, that a player with ten minutes should watch, each with one line on what to look for.
- For "matchups" and "plays_to_run", name only our own players and our own plays that appear in the material, and leave the list empty when there is nothing to base it on.
- "gaps" lists what has not been captured yet that would change the plan, so the scouts know what to look for next.
- "player_message" is a message of 200 to 350 words that the captain can paste into the team chat. Plain text with no markdown, short paragraphs or simple lines, written to the players as "we". It covers who they are, how they score, how they defend, their key players and our three to five keys to the game.
- Write in clear, simple English, using the ultimate terms the team itself uses in its notes. Some notes may be in Afrikaans: understand them and write the brief in English.
- Respond with the JSON object only.`;

// Everything recorded about one opponent, as text for the model. Clips get short ids (C1, C2 …) to cite.
function aiDossier(t) {
  const clips = clipsOfTeam(t.id).filter(c => gameLive(c.gameId)).sort(byGameThenStart);
  const ids = new Map(clips.map((c, i) => [c.id, `C${i + 1}`]));
  const roster = rosterOf(t.id), notes = notesOf(t.id), plan = gpOf(t.id), out = [];
  const add = (title, lines) => { const l = lines.filter(Boolean); if (l.length) out.push(`## ${title}\n${l.join('\n')}`); };
  out.push(`# Opponent: ${t.name}\nTournament or division: ${db.division || 'not given'}\nPrepared for: ${ourTeams()[0]?.name || 'our team'}`);
  add('Organiser notes on this team', [(t.notes || '').trim()]);
  add('Notes from the film group', notes.map(n => `- ${n.text.trim()}${n.author || n.voiceFrom ? ` (${[n.voiceFrom && `voice note from ${n.voiceFrom}`, n.author].filter(Boolean).join(', ')})` : ''}`));
  add('The game plan written so far', [plan.keys && `Keys to the game:\n${plan.keys}`, plan.off && `On offence:\n${plan.off}`, plan.def && `On defence:\n${plan.def}`, plan.line && `Line calls:\n${plan.line}`,
    ...Object.entries(plan.m || {}).filter(([pid, who]) => who && db.players[pid]).map(([pid, who]) => `Match-up already chosen: ${who} takes ${playerLabel(db.players[pid])}`)]);
  add('Their players', sortPlayers(roster, clips).map(p => {
    const tk = xs('tk').filter(o => o.pid === p.id && gameLive(o.gameId)).flatMap(o => o.ev || []);
    const bits = [p.role, HANDS[p.hand], p.threat ? `${THREAT[p.threat]} threat` : '', p.match ? `matches up as ${p.match}` : ''].filter(Boolean).join(', ');
    return [`- ${playerLabel(p)}${bits ? ` (${bits})` : ''}`, (p.tendencies || []).length && `  Tendencies: ${p.tendencies.join(', ')}`, p.strengths && `  Strengths: ${p.strengths}`, p.weaknesses && `  Weaknesses: ${p.weaknesses}`, p.notes && `  How to stop them: ${p.notes}`,
      tk.length && `  Followed throw by throw: ${tkText(p, tkSummary(tk)).split('\n').slice(1).join('; ')}`].filter(Boolean).join('\n');
  }));
  const count = side => { const n = new Map(); for (const c of clips) if (c.side === side) for (const tag of c.tags || []) n.set(tag, (n.get(tag) || 0) + 1); return [...n].sort((a, b) => b[1] - a[1]).map(([tag, k]) => `${tag} x${k}`).join(', '); };
  add('How often each tag appears', [count('O') && `When they are on offence: ${count('O')}`, count('D') && `When they are on defence: ${count('D')}`]);
  add(`Clips (${clips.length})`, clips.map(c => {
    const g = db.games[c.gameId], who = playersOfClip(c).map(playerLabel).join(', '), cm = cmOf(c.id);
    return [`- ${ids.get(c.id)} | ${g.title} at ${fmt(c.start)} | ${sideName(c.side, c.teamId)}${c.priority === 3 ? ' | MUST WATCH' : c.priority === 1 ? ' | context only' : ''}${(c.tags || []).length ? ` | tags: ${c.tags.join(', ')}` : ''}${who ? ` | players: ${who}` : ''}${(c.drawings || []).length ? ' | has a drawing' : ''}`,
      c.note && `  Note${c.author ? ` (${c.author})` : ''}: ${c.note.trim()}`, ...cm.map(x => `  Comment (${x.author || 'someone'}): ${x.text}`)].filter(Boolean).join('\n');
  }));
  const games = gamesOf(t.id).filter(g => stPoints(g.id).length);
  add('Our recorded stats against them', games.map(g => {
    const pts = stPoints(g.id), c = sdCompute(pts), [us, them] = stScore(pts);
    return `- ${g.title}: ${us}-${them} over ${pts.length} recorded points. We held ${c.holds.length} of ${c.o.length} offence points and broke on ${c.breaks.length} of ${c.d.length} defence points. Our turnovers: ${c.turns.throwaway} throwaways, ${c.turns.drop} drops, ${c.turns.stall} stalls. They scored on ${c.theyScored} of ${c.theirEnded.length} recorded possessions, we got ${c.weBlocked} blocks and they gave it away ${c.theyTurned} times.`;
  }));
  const ours = ourPlayers().filter(p => !p.out);
  add('Our available players', ours.map(p => `- ${playerLabel(p)}${[p.role, p.match && `matches up as ${p.match}`].filter(Boolean).length ? ` (${[p.role, p.match && `matches up as ${p.match}`].filter(Boolean).join(', ')})` : ''}`));
  add('Our saved lines', xs('ln').map(l => `- ${l.name || 'Line'}: ${(l.ids || []).map(id => db.players[id]?.name).filter(Boolean).join(', ')}${l.note ? ` (${l.note})` : ''}`));
  add('Our playbook', livePlays().map(p => `- ${p.name || 'Untitled play'} (${p.kind || 'offence'})${p.summary ? `: ${p.summary}` : ''}`));
  return { text: out.join('\n\n'), ids, counts: { clips: clips.length, notes: notes.length + ((t.notes || '').trim() ? 1 : 0), players: roster.length } };
}

    </ul>

async function abWrite(teamId) {
  const t = db.teams[teamId];
  if (!t || t.deleted || ai.busy) return;
  if (!aiKey()) { aiKeyDialog(teamId); return; }
  const dossier = aiDossier(t);
  if (!dossier.counts.clips && !dossier.counts.notes) { toast('There is nothing recorded on this team yet. Tag some clips or add notes first.'); return; }
  Object.assign(ai, { busy: teamId, chars: 0, error: '', errTeam: null, errSeen: false, doneFor: null, stopped: false, stop: null });
  renderHub();
  let Anthropic = null;
  try {
    Anthropic = await aiSdk();
    const client = new Anthropic({ apiKey: aiKey(), dangerouslyAllowBrowser: true });
    const request = {
      model: AI_MODEL, max_tokens: 32000, system: AI_SYSTEM,
      output_config: { effort: 'high', format: { type: 'json_schema', schema: AI_SCHEMA } },
      messages: [{ role: 'user', content: dossier.text }],
    };
    const run = withFallback => {
      // If Claude declines a request, the fallback lets the API hand it to another model inside the same call.
      const stream = withFallback ? client.beta.messages.stream({ ...request, betas: ['server-side-fallback-2026-07-01'], fallbacks: 'default' }) : client.messages.stream(request);
      ai.stop = () => stream.abort();
      stream.on('text', delta => { ai.chars += delta.length; const el = $('#abProg'); if (el) el.textContent = `Writing the brief… ${ai.chars.toLocaleString()} characters so far.`; aiChipRender(); });
      return stream.finalMessage();
    };
    let msg;
    try { msg = await run(true); }
    catch (e) { if (e instanceof Anthropic.BadRequestError && !ai.stopped) { ai.chars = 0; msg = await run(false); } else throw e; }
    if (msg.stop_reason === 'refusal') throw new Error('Claude declined to write this brief. Nothing was saved.');
    if (msg.stop_reason === 'max_tokens') throw new Error('The brief came out too long and was cut off. Try again.');
    const brief = JSON.parse(msg.content.filter(b => b.type === 'text').map(b => b.text).join(''));
    // Clip ids come back as C1, C2 …: turn them into the real ones, dropping any the model made up.
    const back = new Map([...dossier.ids].map(([id, short]) => [short, id])), real = list => (list || []).map(x => back.get(String(x).trim().toUpperCase())).filter(Boolean);
    for (const k of ['their_offence', 'their_defence', 'key_players']) for (const x of brief[k] || []) x.clips = real(x.clips);
    brief.must_watch = (brief.must_watch || []).map(x => ({ ...x, clip: real([x.clip])[0] })).filter(x => x.clip);
    const cur = xGet(abId(teamId));
    xPut({ ...(cur || { createdAt: Date.now() }), id: abId(teamId), kind: 'ab', teamId, brief, author: me || '', model: msg.model, n: dossier.counts });
    ai.doneFor = teamId;
    toast(`The brief on ${t.name} is ready.`);
  } catch (e) {
    if (ai.stopped) ai.error = '';
    else if (Anthropic && e instanceof Anthropic.AuthenticationError) ai.error = 'Anthropic did not accept that API key. Open AI set-up and paste it again.';
    else if (Anthropic && e instanceof Anthropic.PermissionDeniedError) ai.error = 'That API key is not allowed to use this model. Check the key in the Anthropic console.';
    else if (Anthropic && e instanceof Anthropic.RateLimitError) ai.error = 'Anthropic is rate-limiting this key right now. Wait a minute and try again.';
    else if (Anthropic && e instanceof Anthropic.APIConnectionError) ai.error = 'Could not reach Anthropic. Check your connection and try again.';
    else if (Anthropic && e instanceof Anthropic.APIError) ai.error = `Anthropic returned an error (${e.status || 'unknown'}): ${e.message}`;

function sdDeep(pts) {
  const theirs = [], pulls = [], zones = { oe: 0, oh: 0, ph: 0, pe: 0, none: 0 }, chains = new Map(), zpos = new Map();
  // Their passes count for a game once somebody has tapped any of them in it: from then on, a possession with

  const counted = new Set(pts.filter(p => (p.ev || []).some(e => e.k === 'tpass')).map(p => p.gameId));
  for (const p of pts) {
    const tracked = counted.has(p.gameId);
    const fresh = df => { const x = { end: '', passes: 0, tracked, df: df || '', w: '', mm: '' }; theirs.push(x); return x; };
    let their = p.start === 'D' ? fresh(p.df) : null, a1 = null;
    if (p.start === 'D' && p.out) pulls.push({ by: (p.pull || {}).by || '', land: (p.pull || {}).land || '', hang: +(p.pull || {}).hang || 0, df: p.df || '', broke: p.out === 'us' });
    for (const [k, id] of Object.entries(p.zn || {})) if (db.players[id]) { const m = zpos.get(id) || {}; m[k] = (m[k] || 0) + 1; zpos.set(id, m); }
    for (const e of p.ev || []) {
      if (e.k === 'pass' || e.k === 'goal') {
        if (a1 && a1.b === e.a) { const key = `${a1.a}>${a1.b}>${e.b}`, x = chains.get(key) || { ids: [a1.a, a1.b, e.b], n: 0, g: 0 }; x.n++; if (e.k === 'goal') x.g++; chains.set(key, x); }
        a1 = e.k === 'pass' ? e : null;
      } else a1 = null;
      if (e.k === 'turn') { zones[e.z in zones ? e.z : 'none']++; their = fresh(e.df); }
      else if (e.k === 'tpass') { their ||= fresh(''); their.passes++; }
      else if (e.k === 'block' || e.k === 'tturn' || e.k === 'tgoal') { their ||= fresh(''); their.end = e.k; their.w = e.w || ''; their.mm = e.mm || ''; their = null; }
    }

  return { theirs: theirs.filter(x => x.end), pulls, zones, zpos, chains: [...chains.values()].sort((a, b) => b.n - a.n || b.g - a.g) };
}

    case 'rf': { const f = ui.reel.f; f[b.dataset.k] = b.dataset.k === 'minPri' ? +v : v; renderReel(); break; }
    case 'rfTag': { const f = ui.reel.f, i = f.tags.indexOf(v); i >= 0 ? f.tags.splice(i, 1) : f.tags.push(v); renderReel(); break; }
    case 'rfPlayer': { const f = ui.reel.f, i = f.players.indexOf(v); i >= 0 ? f.players.splice(i, 1) : f.players.push(v); renderReel(); break; }
    case 'reelPlay': startReel(0); break;
    case 'reelJump': startReel(+v); break;
    case 'reelNext': reelNext(); break;
    case 'reelPrev': reelPrev(); break;
    case 'reelStop': stopReel(); if (ready()) player.pauseVideo(); break;
    case 'copyReel': copyText(reelText(), 'Reel timestamps'); break;
    case 'copyReport': copyText(reportText(db.teams[ui.teamId]), 'Report'); break;
    case 'playMust': ui.reel.f = { teamId: ui.teamId, side: 'all', tags: [], players: [], minPri: 3 }; setMode('reel', false); startReel(0); renderPanel(); break;
    case 'export': exportPack(); break;
    case 'import': $('#importFile').click(); break;
    case 'help': helpDialog(); break;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (hubInput(t)) return;
  if (t.id === 'edNote' && ui.draft) ui.draft.note = t.value;
  else if (t.id === 'teamNotes') { const tm = db.teams[ui.teamId]; if (tm) { tm.notes = t.value; touch(tm); save(); } }
  else if (t.id === 'myName' || t.id === 'menuName') {
    me = t.value.trim(); store.set(KEY_ME, me);
    actLog.dirty = true; actPushSoon(); actRefreshSoon();
    if (t.id === 'menuName') $('#myName').value = me;
    $('#myName').classList.toggle('needs', !me); $('#menuDot').hidden = !!me;
  }
  else if (t.id === 'division' || t.id === 'menuDivision') { db.division = t.value; db.divisionAt = Date.now(); save(); if (t.id === 'menuDivision') $('#division').value = t.value; }
  else if (t.id === 'dbLabel') ui.labels[ui.drawing?.tool === 'd' ? 'd' : 'o'] = t.value;
  else if (t.dataset.pf && ui.profileId) { const p = db.players[ui.profileId]; p[t.dataset.pf] = t.value; touch(p); save(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (hubChange(t)) return;
  if ((t.id === 'edIn' || t.id === 'edOut') && ui.draft) {
    const val = parseTime(t.value);
    if (val == null) { toast('Type a time like 12:34 or 1:02:03.'); syncEditorTimes(); return; }
    ui.draft[t.id === 'edIn' ? 'start' : 'end'] = val;
    syncEditorTimes(); renderDraftRange();
  } else if (t.dataset.change === 'hold' && ui.draft) {
    const x = ui.draft.drawings.find(z => z.id === t.dataset.v); if (x) x.hold = +t.value;
  } else if (t.id === 'speed' || t.id === 'fsSpeed') { ui.speed = +t.value; applySpeed(); t.blur(); }
  else if (t.id === 'stopAtDrawings' || t.id === 'rfStop') { ui.stopAtDrawings = t.checked; $('#stopAtDrawings').checked = t.checked; saveUi(); }
  else if (t.id === 'rfTeam') { Object.assign(ui.reel.f, { teamId: t.value, players: [], verdict: 'all' }); renderReel(); }
  else if (t.id === 'importFile') { const f = t.files[0]; t.value = ''; if (f) importFile(f); }
});
document.addEventListener('submit', e => {
  if (e.target.dataset.form !== 'quickGame') return;
  e.preventDefault();
  const msg = addGame({ url: $('#qgUrl').value, title: '', teamIds: [ui.teamId], assignee: me });
  if (msg) toast(msg);
});

function addCustomTag(input) {
  const v = input.value.trim().replace(/\s+/g, ' ');
  if (!v || !ui.draft) return;
  const all = [...TAG_GROUPS.flatMap(g => g.tags), ...(db.customTags || [])];
  const existing = all.find(x => norm(x) === norm(v)) || v;
  if (!all.includes(existing)) { db.customTags = [...(db.customTags || []), existing]; save(); }
  if (!ui.draft.tags.includes(existing)) ui.draft.tags.push(existing);
  $('#edTags').innerHTML = tagChips(ui.draft);
  $('#edNewTag')?.focus();
}
function addQuickPlayer(input) {
  const raw = input.value.trim();
  if (!raw || !ui.draft) return;
  const m = raw.match(/^#?(\d{1,3})\s*(.*)$/);
  const number = m ? m[1] : '', name = (m ? m[2] : raw).trim() || `#${number}`;
  let p = rosterOf(ui.draft.teamId).find(x => (number && String(x.number) === number) || norm(x.name) === norm(name));
  if (!p) { p = touch({ id: uid('pl'), teamId: ui.draft.teamId, number, name, role: '', threat: 0, notes: '' }); db.players[p.id] = p; save(); renderRail(); }
  if (!ui.draft.playerIds.includes(p.id)) ui.draft.playerIds.push(p.id);
  $('#edPlayers').innerHTML = playerChips(ui.draft);
  $('#edNewPlayer')?.focus();
}

document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.id === 'tkNew' && e.key === 'Enter') { e.preventDefault(); tkNewPlayer(); return; }
  if (t.id === 'tkMate' && e.key === 'Enter') { e.preventDefault(); tkAddMate(t); return; }
  if (t.classList && t.classList.contains('cm-in')) { if (e.key === 'Enter') { e.preventDefault(); cmSend(t.dataset.id); } return; }
  if (t.id === 'edNewTag' && e.key === 'Enter') { e.preventDefault(); addCustomTag(t); return; }
  if (t.id === 'edNewPlayer' && e.key === 'Enter') { e.preventDefault(); addQuickPlayer(t); return; }
  if (t.id === 'pfNewTendency' && e.key === 'Enter') {
    e.preventDefault();
    const p = db.players[ui.profileId], v = t.value.trim().replace(/\s+/g, ' ');
    if (p && v && !(p.tendencies || []).some(x => norm(x) === norm(v))) { p.tendencies = [...(p.tendencies || []), v]; touch(p); save(); renderPanel(); $('#pfNewTendency')?.focus(); }
    return;
  }
  if (t.id === 'edNote' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveDraft(); return; }
  if ($('#dlg').open) return;
  if (t.closest('input, textarea, select, [contenteditable="true"]')) { if (e.key === 'Escape') t.blur(); return; }
  if (e.altKey) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (ui.view !== 'film') { hubKey(e, k); return; }

  if (ui.drawing) {
    const step = e.shiftKey ? 0.02 : 0.004, arrows = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
    if (k === 'Escape') { if (inkSel()) { ui.drawing.sel = null; renderDrawbar(); renderInk(); } else cancelDrawing(); } // first Esc only lets go of the mark
    else if (k === 'Enter') saveDrawing();
    else if (k === 'z' && (e.ctrlKey || e.metaKey)) inkUndo();
    else if ((k === 'Delete' || k === 'Backspace') && inkSel()) inkDelete();
    else if (arrows[k] && inkSel()) inkNudge(...arrows[k]);
    else return;
    e.preventDefault(); return;
  }
  if (e.ctrlKey || e.metaKey) return;
  if (k === 'Enter' && t.closest('button, a')) return;
  const handled = {
    ' ': togglePlay, k: togglePlay,
    j: () => seekBy(-5), l: () => seekBy(5),
    ArrowLeft: () => seekBy(-10), ArrowRight: () => seekBy(10), c: toggleCaptions,
    ',': () => step(-0.1), '.': () => step(0.1),
    '[': () => changeSpeed(-1), ']': () => changeSpeed(1),
    i: markIn, o: markOut, d: () => startDrawing(), f: toggleFullscreen,
    s: () => { if (isFull() && !phone()) stFloatToggle(); },
    n: () => ui.reel.active && reelNext(), p: () => ui.reel.active && reelPrev(),
    Enter: () => ui.draft && saveDraft(),
    Escape: () => { if (ui.profileFull) setProfileFull(false); else if (ui.showing && !ui.showing.static) keepPaused(); else if (isFull()) exitFull(); else if (ui.draft) cancelDraft(); },
  }[k];
  if (handled) { e.preventDefault(); handled(); }
});

/* timeline interaction: tap to jump, tap a block to play that clip, drag to scrub */
const track = $('#track');
let scrub = null, scrubbedAt = 0;
const trackFrac = x => { const r = track.getBoundingClientRect(); return clamp((x - r.left) / r.width, 0, 1); };
function showTrackTime(f) {
  const dur = lastDur || duration(), ht = $('#hoverTime');
  if (!dur) { ht.hidden = true; return; }
  ht.hidden = false; ht.textContent = fmt(f * dur); ht.style.left = `${f * 100}%`;
}
track.addEventListener('click', e => {
  const dur = lastDur || duration();
  if (!dur || performance.now() - scrubbedAt < 300) return;
  const seg = e.target.closest('[data-clip]');
  if (seg) { const c = db.clips[seg.dataset.clip]; if (c) { if (ui.reel.active) stopReel(true); playClip(c); } return; }
  seekTo(trackFrac(e.clientX) * dur);
});
track.addEventListener('pointerdown', e => {
  if (!(lastDur || duration()) || e.button > 0) return;
  scrub = { id: e.pointerId, x0: e.clientX, moved: false, f: 0, kind: e.pointerType };
});
track.addEventListener('pointermove', e => {
  const f = trackFrac(e.clientX);
  if (scrub && scrub.id === e.pointerId) {
    if (!scrub.moved && Math.abs(e.clientX - scrub.x0) > 8) { scrub.moved = true; try { track.setPointerCapture(e.pointerId); } catch {} }
    if (scrub.moved) { scrub.f = f; $('#playhead').style.left = `${f * 100}%`; showTrackTime(f); return; }
  }
  if (e.pointerType === 'mouse') showTrackTime(f);
});
const endScrub = e => {
  if (!scrub || scrub.id !== e.pointerId) return;
  const s = scrub; scrub = null;
  if (s.moved) {
    scrubbedAt = performance.now();
    seekTo(s.f * (lastDur || duration()));
    if (s.kind !== 'mouse') $('#hoverTime').hidden = true;
  }
};
track.addEventListener('pointerup', endScrub);
track.addEventListener('pointercancel', e => { if (scrub?.id === e.pointerId) { scrub = null; $('#hoverTime').hidden = true; } });
track.addEventListener('mouseleave', () => { if (!scrub) $('#hoverTime').hidden = true; });

// Keeps the notes below the pinned video from hiding under it when the page scrolls to them.
new ResizeObserver(() => document.documentElement.style.setProperty('--video-h', `${$('#videoWrap').offsetHeight}px`)).observe($('#videoWrap'));
new ResizeObserver(() => document.documentElement.style.setProperty('--fsb', `${$('#fsBottom').offsetHeight}px`)).observe($('#fsBottom'));

/* ================= boot ================= */
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
fixSelection();
renderNav();
renderAll();
renderTeamButton();
renderStatus();
if (ui.gameId) selectGame(ui.gameId);
if (DEV_SYNC) {
  const room = roomFromText(location.hash) || store.get(KEY_ROOM);
  if (room && me) { adoptRoom(room); startSync(room); }
  else devRoomDialog();
} else if (SYNC_AVAILABLE) {
  // Nobody sees the team's film until they sign in. Wait to learn whether this device is already signed in.
  gate('loading');
  firebase().then(f => {
    let first = true;
    f.A.onAuthStateChanged(f.auth, user => {
      if (!first) return;
      first = false;
      if (user) afterSignIn(user); else gate('signin');
    });
  }).catch(e => { console.error(e); gate('signin', { error: 'Could not load the sign-in. Check your connection and reload the page.' }); });
}
})();
</script>
